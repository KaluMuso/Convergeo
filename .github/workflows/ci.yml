  money-db-triggers:
    name: Money DB-trigger integration
    runs-on: ubuntu-latest
    # Release-accounting, release-idempotency and reconciliation DB tests exercise the
    # SQL-trigger money path (zero-sum, guarded release ordering, recon report uniqueness).
    # They skip without a live Postgres, and each seeds its own platform ledger-account id
    # family — so they collide with each other and with the rls job's curated set in one
    # process on the unique ledger_accounts_kind_platform_key. Run each in isolation against
    # a bare pgvector service, resetting the schema per file (the module `db` fixture then
    # re-applies migrations). Keeps this money coverage from silently skipping in CI.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Provision Supabase-managed roles
        # AUTH_BOOTSTRAP_SQL (tests/rls/conftest.py) creates anon/authenticated/service_role
        # but not the GoTrue roles migration 0051 grants to; add them like
        # scripts/ci/migration-replay.sh does for its bare-Postgres replay.
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin LOGIN SUPERUSER;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin NOLOGIN NOINHERIT;
            END IF;
          END $$;
          SQL

      - name: Release / accounting / reconcile (each isolated)
        run: |
          for f in test_release test_release_accounting test_reconcile; do
            echo "::group::$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS auth CASCADE; DROP SCHEMA IF EXISTS extensions CASCADE; DROP SCHEMA IF EXISTS reconciliation_private CASCADE; DROP EXTENSION IF EXISTS vector CASCADE; DROP EXTENSION IF EXISTS pg_trgm CASCADE;"
            uv run pytest "tests/$f.py" -q
            echo "::endgroup::"
          done

      - name: Staging cleanup DB regression (notification-outbox scope)
        # build_cleanup_sql()'s outbox DELETE is only provable against a real
        # migrated database: tests/test_staging_cod_fixture.py asserts the SQL
        # text, which cannot catch a predicate that matches nothing. The
        # `python` job has no Postgres, so test_seed_staging.py's fixture skips
        # there — this is the one place the behavioural cases actually execute.
        # Isolated on purpose: its own schema reset, its own process, and NOT
        # the rls job (whose curated set depends on retained fixture state).
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS auth CASCADE; DROP SCHEMA IF EXISTS extensions CASCADE; DROP SCHEMA IF EXISTS reconciliation_private CASCADE; DROP EXTENSION IF EXISTS vector CASCADE; DROP EXTENSION IF EXISTS pg_trgm CASCADE;"
          uv run pytest tests/test_seed_staging.py -q \
            --junit-xml=staging-cleanup-regression.xml

      - name: Prove the outbox regression ran (no silent skip)
        # A green pytest exit code is NOT proof these ran: the database fixture
        # skips on an unreachable Postgres, a missing extension or a failed
        # migration. Fail the job unless every named case is present and passed.
        if: always()
        run: python3 ../../scripts/ci/assert_outbox_regression_ran.py staging-cleanup-regression.xml

      - name: Upload staging cleanup regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-cleanup-regression
          path: services/api/staging-cleanup-regression.xml
          if-no-files-found: error

      - name: Cart idempotency DB contract (16 PostgreSQL cases and 4 URI guards)
        timeout-minutes: 5
        env:
          PGCONNECT_TIMEOUT: "5"
          PAYMENTS_ENABLED: "false"
          PAYMENTS_ALLOW_PRODUCTION: "false"
          LENCO_ENV: sandbox
        run: |
          set -euo pipefail
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGPORT PGDATABASE PGUSER PGPASSWORD PGOPTIONS
          cart_db_nonce=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          [[ "$cart_db_nonce" =~ ^[a-f0-9]{32}$ ]]
          cart_db_name="cart-idem-$cart_db_nonce"
          cart_db_cluster="cart_idem_test-$cart_db_nonce"
          cart_db_cid=
          cart_db_start_attempted=false
          cart_db_root=
          cart_db_verified=false
          cart_db_server_verified=false
          cart_db_pytest_status=not_run
          cart_db_source=$(git rev-parse HEAD)
          [[ "$cart_db_source" =~ ^[a-f0-9]{40}$ && "$cart_db_source" = "${QUALIFICATION_SHA:?}" ]]
          rm -f cart-idempotency-db.xml cart-idempotency-db-sanitized.xml cart-idempotency-db-validation.json cart-idempotency-db-lifecycle.json
          cart_db_owned() {
            [[ "$cart_db_cid" =~ ^[a-f0-9]{64}$ ]] &&
              [[ "$(timeout 10 docker inspect --format '{{ index .Config.Labels "convergeo.cart-native" }}' "$cart_db_cid")" = "$cart_db_nonce" ]]
          }
          cleanup_cart_db() {
            cart_db_status=$?
            trap - EXIT
            cart_db_cleanup_ok=true
            # Recover only this nonce-labelled name after a partially failed Docker start.
            if [ -z "$cart_db_cid" ] && [ "$cart_db_start_attempted" = true ]; then
              if cart_db_partial=$(timeout 10 docker inspect --format '{{.Id}}' "$cart_db_name" 2>/dev/null); then
                cart_db_cid="$cart_db_partial"
              else
                # An inspection failure cannot prove absence after an attempted start.
                cart_db_cleanup_ok=false
              fi
            fi
            if [ -n "$cart_db_cid" ]; then
              if ! cart_db_owned; then
                cart_db_cleanup_ok=false
              elif ! timeout 10 docker rm --force "$cart_db_cid" >/dev/null; then
                cart_db_cleanup_ok=false
              elif ! cart_db_remaining=$(timeout 10 docker container ls --all --filter "id=$cart_db_cid" --format '{{.ID}}'); then
                cart_db_cleanup_ok=false
              elif [ -n "$cart_db_remaining" ]; then
                cart_db_cleanup_ok=false
              fi
            fi
            if [ -n "$cart_db_root" ] && [ "$cart_db_cleanup_ok" = true ]; then
              if ! rm -rf -- "$cart_db_root"; then cart_db_cleanup_ok=false; fi
            fi
            if ! python3 - "$cart_db_source" "$cart_db_verified" "$cart_db_server_verified" "$cart_db_pytest_status" "$cart_db_cleanup_ok" <<'PY'
          import json, sys
          from pathlib import Path
          source, container, server, status, cleanup = sys.argv[1:]
          Path('cart-idempotency-db-lifecycle.json').write_text(json.dumps({
              'source_sha': source,
              'owned_container_verified': container == 'true',
              'postgres17_database_cluster_verified': server == 'true',
              'pytest_exit_code': None if status == 'not_run' else int(status),
              'owned_container_and_directory_cleanup': cleanup == 'true',
          }, indent=2) + '\n')
          PY
            then cart_db_cleanup_ok=false; fi
            if [ "$cart_db_cleanup_ok" != true ] && [ "$cart_db_status" -eq 0 ]; then cart_db_status=1; fi
            exit "$cart_db_status"
          }
          trap cleanup_cart_db EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          # Reuse immutable bytes from the already-provisioned job service; never pull an image.
          cart_db_image=$(timeout 10 docker inspect --format '{{.Image}}' '${{ job.services.postgres.id }}')
          [[ "$cart_db_image" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(timeout 10 docker image inspect --format '{{.Id}}' "$cart_db_image")" = "$cart_db_image" ]]
          [[ "${RUNNER_TEMP:?}" = /* && -d "$RUNNER_TEMP" ]]
          cart_db_root=$(mktemp -d "$RUNNER_TEMP/cart-idem.XXXXXXXX")
          cart_db_socket="$cart_db_root/socket"
          mkdir "$cart_db_socket"
          cart_db_start_attempted=true
          cart_db_cid=$(timeout 10 docker run --detach --pull=never --name "$cart_db_name" \
            --label "convergeo.cart-native=$cart_db_nonce" --network none \
            --tmpfs /var/lib/postgresql/data:rw \
            --mount "type=bind,src=$cart_db_socket,dst=/var/run/postgresql" \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=cart_idem_test \
            "$cart_db_image" -c listen_addresses= -c "cluster_name=$cart_db_cluster")
          cart_db_owned
          # Check actual resource isolation before any fixture connection or DDL.
          timeout 10 docker inspect "$cart_db_cid" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d)==1; d=d[0]; assert d["Id"]==sys.argv[1]; assert d["Image"]==sys.argv[2]; assert d["Config"]["Labels"]["convergeo.cart-native"]==sys.argv[3]; h=d["HostConfig"]; assert h["NetworkMode"]=="none" and not h.get("PortBindings") and not h.get("Privileged"); assert set(h.get("Tmpfs",{}))=={"/var/lib/postgresql/data"}; m=d["Mounts"]; assert len(m)==1 and m[0]["Type"]=="bind" and m[0]["Source"]==sys.argv[4] and m[0]["Destination"]=="/var/run/postgresql"' "$cart_db_cid" "$cart_db_image" "$cart_db_nonce" "$cart_db_socket"
          cart_db_verified=true
          cart_db_ready=false
          for cart_db_attempt in $(seq 1 20); do
            if timeout 5 docker exec --user postgres "$cart_db_cid" pg_isready -q -t 3 -h /var/run/postgresql -U postgres -d cart_idem_test; then
              cart_db_ready=true
              break
            fi
            sleep 1
           done
          [[ "$cart_db_ready" = true ]]
          # Only the newly owned socket directory changes mode; its parent stays private0700.
          timeout 10 docker exec --user postgres "$cart_db_cid" chmod 0777 /var/run/postgresql
          cart_db_identity=$(timeout 10 docker exec --user postgres "$cart_db_cid" \
            psql -U postgres -d cart_idem_test -Atc "select current_setting('server_version_num') || '|' || current_database() || '|' || current_setting('cluster_name')")
          [[ "$cart_db_identity" =~ ^17[0-9]{4}\|cart_idem_test\|cart_idem_test-[a-f0-9]{32}$ ]]
          [[ "$cart_db_identity" = *"|cart_idem_test|$cart_db_cluster" ]]
          cart_db_server_verified=true
          export CART_IDEMPOTENCY_TEST_CLUSTER_NAME="$cart_db_cluster"
          export CART_IDEMPOTENCY_TEST_SOCKET_DIRECTORY="$cart_db_socket"
          export CART_IDEMPOTENCY_TEST_DATABASE_URL=$(python3 -c 'import os; from urllib.parse import quote; print("postgresql://postgres@" + quote(os.environ["CART_IDEMPOTENCY_TEST_SOCKET_DIRECTORY"], safe="") + "/cart_idem_test")')
          # Preserve native failures; cleanup failure also prevents a green execution.
          set +e
          timeout 120 uv run --frozen --no-sync pytest tests/test_cart_add_idempotency_db.py -q --junitxml=cart-idempotency-db.xml
          cart_db_pytest_status=$?
          set -e
          exit "$cart_db_pytest_status"

      - name: Prove every cart idempotency case and owned cleanup passed
        if: always()
        run: |
          python3 ../../scripts/ci/assert_cart_idempotency_ran.py \
            cart-idempotency-db.xml cart-idempotency-db-sanitized.xml cart-idempotency-db-validation.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('cart-idempotency-db-lifecycle.json').read_text())
          assert d['source_sha'] == os.environ['QUALIFICATION_SHA']
          assert d['owned_container_verified'] is True
          assert d['postgres17_database_cluster_verified'] is True
          assert d['pytest_exit_code'] == 0
          assert d['owned_container_and_directory_cleanup'] is True
          PY

      - name: Upload cart idempotency DB evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cart-idempotency-db-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            services/api/cart-idempotency-db-sanitized.xml
            services/api/cart-idempotency-db-validation.json
            services/api/cart-idempotency-db-lifecycle.json
          if-no-files-found: error

  cod-container-smoke:
    name: COD production-container smoke
    # Blocking (WP-1B): builds the real infra/api.Dockerfile image and drives ONE
    # Cash-on-Delivery order through the running container against an isolated Postgres,
    # asserting order created + audit entry (transaction-local actor/note context) +
    # ledger/commission postings + consistent order/escrow state. Proves the runtime
    # image's native psycopg write path (WP-1A) works with NO psql binary and NO
    # external network — Lenco, WhatsApp and Supabase are never contacted (auth is a
    # localhost JWKS/user_roles stub with a self-minted token). The job is always
    # present so it stays a stable required check; the heavy steps run only when the API,
    # its Dockerfile, the migration shim, or this workflow change — and always on master.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same explicitly qualified image input as migration replay.
        image: pgvector/pgvector:0.8.0-pg17-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          # Full history so the path filter can diff against the PR base sha.
          fetch-depth: 0

      - name: Detect API / Dockerfile changes
        id: changes
        run: |
          # master pushes (and the nightly schedule) always run the container gate.
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Eq \
             '^(services/api/|infra/api\.Dockerfile|scripts/ci/migration-replay\.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        # Host-side psql for the schema replay + fixture seed + assertions. The CONTAINER
        # must never need it — that is precisely what this test guards.
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: services/api
        run: uv sync --dev --frozen

      - name: Set up Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build the real API runtime image
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          load: true
          tags: vergeo5-api:cod-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Drive one COD order through the running image
        if: steps.changes.outputs.run == 'true'
        working-directory: services/api
        run: uv run python tests/container/cod_container_smoke.py
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          VERGEO5_API_IMAGE: vergeo5-api:cod-smoke
