name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Nightly Ask Vergeo grounding evals (02:17 UTC). The ask-evals job runs on
    # every scheduled trigger; other jobs are unchanged and simply re-run green.
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Only this isolated review lane selects the immutable head; regular PRs retain merge evidence.
  QUALIFICATION_SHA: ${{ startsWith(github.head_ref, 'codex/coordinator-ci-review-') && github.event.pull_request.head.sha || github.sha }}

jobs:
  js:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Next font loader regression
        run: pnpm test:next-font
      - name: Staged formatter regression tests
        run: pnpm format:staged:test

      - name: Resolve Turbo filter
        id: turbo
        run: |
          if [[ "${{ github.head_ref }}" == codex/coordinator-ci-review-* ]]; then
            echo "filter=*" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "filter=...[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=...[HEAD^1]" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: pnpm turbo run lint --filter="${{ steps.turbo.outputs.filter }}"

      - name: Typecheck
        run: pnpm turbo run typecheck --filter="${{ steps.turbo.outputs.filter }}"

      - name: Test
        run: pnpm turbo run test --filter="${{ steps.turbo.outputs.filter }}"

      # RC-2: the shared Zambian national-number helper OTP specs fill their
      # phone inputs with, proven independently of any live OTP send.
      - name: E2E phone national-number helper tests
        run: node --experimental-strip-types --test scripts/qa/self-test/e2e-phone.test.mjs

      - name: Cart response drill evidence contract tests
        run: node --test scripts/ci/assert-cart-response-drill.test.mjs

      - name: Loopback / wrong-plane guard unit tests
        run: node --test scripts/ci/check-no-loopback-api.test.mjs

      - name: Build
        run: pnpm turbo run build --filter="${{ steps.turbo.outputs.filter }}"

      - name: Fail if frontend bundles ship a loopback or wrong-plane API origin
        run: node scripts/ci/check-no-loopback-api.mjs --require-affected --filter="${{ steps.turbo.outputs.filter }}"

  python:
    name: Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app tests scripts

      - name: Pytest
        # Blocking broad suite (testpaths=tests). The route x role authorization
        # matrix has one mandatory owner below in `security-gates`; excluding that
        # exact file here removes duplicate execution without excluding any other
        # security, integration or deny-path test. F1 real-stack has its dedicated
        # fresh/upgrade owner and fails (rather than skips) without that stack.
        # Merchant stock SQL has the separate 26-identity mandatory owner below.
        run: uv run pytest --ignore=tests/test_authz_matrix.py --ignore=tests/test_f1_payout_real_stack.py --ignore=tests/test_vendor_stock_adjustment_db.py --ignore=tests/test_merchant_review_boundaries_db.py
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key

  ask-evals:
    name: Ask Vergeo grounding evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          # Full history so the path filter can diff against the PR base sha.
          fetch-depth: 0

      - name: Detect Ask pipeline changes
        id: changes
        run: |
          # Nightly schedule + master pushes always run the grounding gate.
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git prints repo-root-relative paths regardless of cwd.
          if git diff --name-only "$base" HEAD | grep -Eq \
             '^(services/api/app/services/ask/|services/api/app/routers/ask\.py|services/api/tests/evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --dev --frozen

      - name: Grounding evals (deterministic — no live API key)
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/evals -q

  edge-functions:
    name: Supabase edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Test send-sms-otp edge function
        working-directory: supabase/functions/send-sms-otp
        run: deno test --allow-env --no-lock index.test.ts

  staging-guards:
    name: Staging plane guards (STG-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      # test-staging-guards.sh invokes scripts/seed_staging.py, which imports
      # `supabase` (Auth Admin API client for canonical persona provisioning)
      # at module level — needs services/api's venv, not bare system python3.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --dev --frozen

      - name: Self-test separation + seed + config syntax
        run: bash scripts/ci/test-staging-guards.sh

      # The E2E portal-identity probe decides whether a release baseline runs
      # against the candidate SHA at all, so its unit contract is a per-PR gate
      # here rather than only inside release-certify.
      - name: E2E staging probe unit tests
        run: node --test scripts/qa/self-test/e2e-staging-probe.test.mjs

      - name: E2E test-OTP preflight unit tests
        run: node --experimental-strip-types --test scripts/qa/self-test/preflight-e2e-test-otp.test.mjs

      - name: Isolated email/password diagnostic unit tests
        run: node --experimental-strip-types --test scripts/qa/self-test/e2e-email-acceptance.test.mjs

      - name: Inactive signed WAHA handoff contract tests
        run: |
          node --test infra/n8n/waha-otp-handoff.test.mjs
          node --experimental-strip-types --test supabase/functions/send-sms-otp/waha_transport.test.mjs

      - name: Email deployment provenance and passwordless replay bootstrap unit tests
        working-directory: services/api
        run: |
          uv run python ../../scripts/ci/test_email_diagnostic_handoff.py
          uv run python ../../scripts/ops/test_apply_otp_replay_login_staging.py

      - name: OTP branch suppression and bounded RLS setup regression
        working-directory: services/api
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          root = Path('../..')
          workflow = yaml.load((root / '.github/workflows/ci.yml').read_text(), Loader=yaml.BaseLoader)
          steps = workflow['jobs']['rls']['steps']
          setup = [step for step in steps if step.get('uses') == 'supabase/setup-cli@v2']
          assert len(setup) == 1
          assert setup[0]['with']['version'] == '2.109.1'
          assert setup[0]['timeout-minutes'] == '5'
          assert setup[0].get('continue-on-error', 'false') == 'false'
          assert next(step for step in steps if step.get('name') == 'RLS isolation matrix')['run'] == 'uv run pytest tests/rls -q'
          expected = {'cursor/auth-diagnostics-otp-744-20261012', 'wp/integrate-auth-catalog-wave1', 'cursor/staging-payment-fail-closed-20261009', 'cursor/staging-email-first-safety-20261009', 'cursor/vendor-recovery-staging-20261007', 'cursor/staging-waha-replay-db-20261009', 'cursor/kyc-bootstrap-empty-20261008', 'cursor/staging-release-compat-20261009', 'cursor/staging-email-diagnostic-leg-20261009', 'cursor/staging-waha-otp-handoff-20261009', 'codex/phone-input-layout-20261008', 'cursor/release-kyc-auth-integration-20261008', 'cursor/typegen-meta-preload-20261012'}
          for name in ('vercel.json', 'apps/admin/vercel.json', 'apps/customer/vercel.json', 'apps/vendor/vercel.json'):
              guards = json.loads((root / name).read_text())['git']['deploymentEnabled']
              assert set(guards) == expected and all(value is False for value in guards.values())
          print('PASS: four append-only disabled branch maps; pinned blocking RLS setup bounded at five minutes')
          PY

      # The gating policy decides whether a missing fixture fails a release
      # baseline or silently skips it, so it is a per-PR gate. It imports the
      # pure TypeScript policy directly (Node type-stripping) — no browser, no
      # Playwright run needed.
      - name: E2E strict-gating policy tests
        run: node --experimental-strip-types --test scripts/qa/self-test/e2e-gating.test.mjs

      # RC-1: the bottom-nav locator must keep matching the real app contract
      # (packages/i18n/messages/en/nav.json shop.bottomAriaLabel), not a
      # data-testid production never renders.
      - name: E2E bottom-nav locator contract tests
        run: node --experimental-strip-types --test scripts/qa/self-test/e2e-nav-contract.test.mjs

      # RC-5: required-synthetic-surface checks (PDP buy box, cart terminal
      # state, vendor storefront) must genuinely wait in strict mode instead
      # of racing an instant isVisible() sample — proven from E2E run #52's
      # actual Playwright artifact, not a hypothesis.
      - name: E2E strict-mode surface-wait contract tests
        run: node --test scripts/qa/self-test/e2e-strict-surface-wait.test.mjs

      # Run #74 root cause B: apps/vendor and apps/admin render the Customer
      # auth shell through relative cross-app imports, so a change confined to
      # apps/customer must still invalidate their Turborepo build hash — or
      # Vercel replays a stale build and the deployed portal silently keeps the
      # old bundle while /health still reports the new SHA. Static check; no
      # turbo run needed.
      - name: Cross-app build-input contract (Turborepo)
        run: node --experimental-strip-types --test scripts/qa/self-test/turbo-cross-app-inputs.test.mjs

      # Run #70 request-boundary remediation: the per-origin Vercel bypass
      # must (a) never hand a portal credential to an unmatched origin and
      # (b) rebuild a rewritten request from allHeaders(), so the Supabase
      # session Cookie survives. Pure logic — no browser, no secrets.
      - name: E2E portal-bypass request-boundary tests
        run: node --experimental-strip-types --test scripts/qa/self-test/e2e-portal-bypass.test.mjs

      # Run #62 SameSite remediation: pure request/assertion logic for the
      # opt-in stable-hostname guest-cart browser probe
      # (e2e/scripts/customer-stable-cart-probe.mjs) — no Playwright import,
      # so this runs from the repo root with no e2e/ install.
      - name: Customer stable-hostname cart probe unit tests
        run: node --test scripts/qa/self-test/customer-stable-cart-probe-lib.test.mjs

  release-control:
    name: Release control contract (RELCTRL-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Self-test release-control contract
        run: bash scripts/ci/test-release-control-contract.sh

  merge-release-gate:
    name: Merge release gate (RELCTRL-01)
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Detect whether merge evidence is required
        id: scope
        run: |
          set -euo pipefail
          python3 scripts/ci/detect_merge_evidence_scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify staging certification artifact (read-only)
        if: steps.scope.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git diff --exit-code
          python3 scripts/ci/verify_staging_certification_gate.py \
            --candidate-sha "${{ github.event.pull_request.head.sha }}" \
            --current-run-id "${{ github.run_id }}"
          git diff --exit-code

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Blocking (RC-06 / G8 / VE-P04): any real finding fails the job.
    # Pinned CLI >=8.28 — path/regex allowlists are broken on gitleaks 8.24.x.
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Self-test scanner catches planted secret
        run: bash scripts/ci/gitleaks-self-test.sh

      - name: Validate n8n workflows have no plaintext secrets
        run: bash scripts/ci/validate-n8n-no-plaintext-secrets.sh

      - name: Run gitleaks
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          raw_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-raw.XXXXXX")"
          trap 'rm -rf -- "$raw_dir"' EXIT
          export GITLEAKS_RAW_REPORT="${raw_dir}/raw.json"
          export GITLEAKS_SAFE_REPORT="${RUNNER_TEMP}/gitleaks-report.json"
          rm -f -- "$GITLEAKS_SAFE_REPORT"
          scanner_status=0
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact=100 \
            --report-format json --report-path "$GITLEAKS_RAW_REPORT" || scanner_status=$?
          export GITLEAKS_EXIT_STATUS="$scanner_status"
          python3 - <<'PYREPORT'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess

          def require(condition):
              if not condition:
                  raise ValueError("Invalid diagnostic metadata")

          def sha(value):
              require(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value))
              return value

          try:
              raw = Path(os.environ["GITLEAKS_RAW_REPORT"])
              findings = json.loads(raw.read_text())
              require(isinstance(findings, list))
              projected = []
              for finding in findings:
                  require(isinstance(finding, dict) and finding.get("Secret") == "REDACTED")
                  rule = finding.get("RuleID")
                  path = finding.get("File")
                  start = finding.get("StartLine")
                  end = finding.get("EndLine")
                  commit = sha(finding.get("Commit"))
                  require(isinstance(rule, str) and re.fullmatch(r"[a-z0-9_-]{1,128}", rule))
                  require(isinstance(path, str) and 0 < len(path) <= 1024)
                  require(not PurePosixPath(path).is_absolute() and ".." not in PurePosixPath(path).parts)
                  require(not any(ord(character) < 32 or ord(character) == 127 for character in path))
                  require(type(start) is int and type(end) is int and 1 <= start <= end)
                  projected.append({"rule_id": rule, "path": path, "start_line": start,
                                    "end_line": end, "commit": commit,
                                    "fingerprint": f"{commit}:{path}:{rule}:{start}"})
              exit_status = int(os.environ["GITLEAKS_EXIT_STATUS"])
              require(0 <= exit_status <= 255)
              run_id = int(os.environ["GITHUB_RUN_ID"])
              attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
              require(run_id > 0 and attempt > 0)
              payload = {
                  "schema_version": 1,
                  "checkout_sha": sha(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()),
                  "checkout_tree": sha(subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()),
                  "candidate_sha": sha(os.environ["CANDIDATE_SHA"]),
                  "run_id": run_id, "run_attempt": attempt,
                  "scanner_version": "8.28.0",
                  "config_sha256": hashlib.sha256(Path(".gitleaks.toml").read_bytes()).hexdigest(),
                  "scanner_exit_status": exit_status,
                  "finding_count": len(projected), "findings": projected,
              }
              # Only this strict projection is published. Raw source matches, secret
              # values, commit messages, author/email and other free text stay private.
              safe = raw.with_name("safe.json")
              safe.write_text(json.dumps(payload, indent=2) + "\n")
              safe.replace(Path(os.environ["GITLEAKS_SAFE_REPORT"]))
          except Exception:
              raise SystemExit("Gitleaks diagnostic report failed validation") from None
          PYREPORT
          exit "$scanner_status"

      - name: Upload projected Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: error
          retention-days: 3

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Dependency audit workflow contract tests
        run: node --test scripts/ci/dependency-audit-contract.test.mjs

      - name: pnpm production audit (fail on high)
        # Separate production scope and full toolchain scope; neither waives advisories.
        run: pnpm audit --prod --audit-level high

      - name: pnpm full dependency audit (fail on high)
        run: pnpm audit --audit-level high

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: pip-audit (API, fail on high)
        # Blocking (M15-P05): pip-audit is non-zero on any known vulnerability.
        working-directory: services/api
        run: |
          uv sync --dev
          uv tool run pip-audit

      - name: Dependency audit consumer process controls
        run: python3 scripts/ci/dependency_audit_consumer.test.py

      - name: Audit Node, frozen API graph, and standalone E2E lock
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/dependency-audit-api-venv
          UV_CACHE_DIR: ${{ runner.temp }}/dependency-audit-uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/dependency-audit-uv-tools
          npm_config_cache: ${{ runner.temp }}/dependency-audit-npm-cache
        run: python3 scripts/ci/dependency_audit_consumer.py --evidence-dir "$RUNNER_TEMP/dependency-audit"

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-evidence
          path: ${{ runner.temp }}/dependency-audit/
          if-no-files-found: error
  security-gates:
    name: Security gates (headers + authz matrix)
    # Blocking (M15-P05) and the sole owner of the complete route x role matrix.
    # Keep this job name stable: it is a required master-branch check context.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Security headers manifest check
        # M15-P03 shipped scripts/ci/check-headers.mjs (node stdlib only, no install).
        run: node scripts/ci/check-headers.mjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --dev --frozen

      - name: Collect trusted authorization matrix inventory
        # Independent collection prevents the execution report from defining its
        # own expected coverage. The manifest is bound to this exact checkout.
        working-directory: services/api
        run: >-
          uv run python3 ../../scripts/ci/assert_authz_matrix_ran.py collect
          --inventory authz-matrix-expected.json
          --repo-root ../..
          --checkout-sha "${QUALIFICATION_SHA}"

      - name: Route x role authz matrix (sole owner, no DB)
        # Isolation-clean: dependency overrides and guards short-circuit before DB
        # calls. JUnit is checked below so an empty or skipped matrix cannot pass.
        working-directory: services/api
        run: uv run pytest tests/test_authz_matrix.py -q --junitxml=authz-matrix.xml
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key

      - name: Prove the authz matrix ran (no silent skip)
        if: always()
        working-directory: services/api
        run: >-
          python3 ../../scripts/ci/assert_authz_matrix_ran.py validate authz-matrix.xml
          --inventory authz-matrix-expected.json
          --repo-root ../..
          --checkout-sha "${QUALIFICATION_SHA}"

      - name: Upload authorization matrix report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authorization-matrix
          path: |
            services/api/authz-matrix.xml
            services/api/authz-matrix-expected.json
          if-no-files-found: error

  i18n-lint:
    name: i18n hardcoded strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run hardcoded-string lint (blocking)
        run: |
          cat > .github/i18n-eslint.ci.mjs <<'EOF'
          import vergeoPlugin from "../packages/config/eslint-rules/no-hardcoded-strings.js";
          import tseslint from "typescript-eslint";

          // Isolated: only the @vergeo/no-hardcoded-strings rule (with the TS
          // parser for TSX) so this gate fails ONLY on hardcoded user-facing
          // strings, not on unrelated tseslint-recommended rules.
          export default [
            { ignores: ["**/node_modules/**", "**/.next/**"] },
            {
              files: ["apps/**/app/**/*.{tsx,jsx}"],
              languageOptions: {
                parser: tseslint.parser,
                parserOptions: {
                  ecmaFeatures: { jsx: true },
                  ecmaVersion: "latest",
                  sourceType: "module",
                },
              },
              plugins: { "@vergeo": vergeoPlugin },
              rules: { "@vergeo/no-hardcoded-strings": "error" },
            },
          ];
          EOF
          pnpm exec eslint \
            "apps/customer/app" \
            "apps/vendor/app" \
            "apps/admin/app" \
            --config .github/i18n-eslint.ci.mjs \
            --max-warnings 0

  migrations:
    name: Migration replay (fast)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Qualification input; runtime checks below prove the mutable tag contents.
        image: pgvector/pgvector:0.8.0-pg17-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Replay migrations (Dockerless pre-flight)
        run: bash scripts/ci/migration-replay.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Verify PostgreSQL/vector runtime and role shape
        run: |
          POSTGRES_CONTAINER_ID="$(docker ps --filter ancestor=pgvector/pgvector:0.8.0-pg17-trixie --format '{{.ID}}' | head -1)" \
            SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            bash scripts/ci/verify-postgres-runtime.sh

      - name: Setup uv (canonical migration re-entrant replay)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python (canonical migration re-entrant replay)
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API deps (canonical migration re-entrant replay)
        working-directory: services/api
        run: uv sync --dev --frozen

      - name: Canonical migration re-entrant replay (STG-DRIFT-03)
        working-directory: services/api
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
        run: uv run pytest tests/test_canonical_migration_reentrant.py -v

      - name: Schema RLS + security_invoker (post-replay)
        # STG-01: same isolation checks the staging deploy job runs against the
        # remote staging DB — exercised here on a blank local replay including 0056.
        run: bash scripts/ci/check-staging-schema.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Install pgTAP for disposable platform RBAC acceptance
        run: |
          docker exec "${{ job.services.postgres.id }}" apt-get update
          docker exec "${{ job.services.postgres.id }}" apt-get install -y --no-install-recommends postgresql-16-pgtap=1.3.4-1.pgdg12+1
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions'

      - name: Platform RBAC SQL and direct API acceptance (disposable PG16)
        working-directory: services/api
        env:
          CONVERGEO_RBAC_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CONVERGEO_DISPOSABLE_DB: "1"
          PAYMENTS_ENABLED: "false"
          PAYMENTS_ALLOW_PRODUCTION: "false"
        run: |
          uv run pytest tests/test_configurable_admin_roles.py -q --junit-xml=rbac-backend.xml
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          cases = ET.parse("rbac-backend.xml").getroot().findall(".//testcase")
          assert len(cases) == 167, f"Expected 167 RBAC acceptance cases, got {len(cases)}"
          assert all(c.find("skipped") is None and c.find("failure") is None and c.find("error") is None for c in cases), "RBAC acceptance contains a skipped or failed case"
          names = Counter(c.attrib["name"].split("[", 1)[0] for c in cases)
          for name, expected in {
              "test_disposable_api_permission_domains": 64,
              "test_disposable_non_admins_cannot_enter_platform": 24,
              "test_disposable_custom_roles_cannot_mutate_money_or_controls": 56,
              "test_disposable_all_thirteen_sql_contracts": 1,
              "test_disposable_browser_identities_cannot_bypass_api": 4,
              "test_disposable_distinct_roles_and_role_union": 1,
              "test_disposable_revocation_and_update_use_unchanged_jwt": 1,
          }.items():
              assert names[name] == expected, (name, names[name], expected)
          print("PASS: 167 RBAC acceptance cases, zero skips; all 13 SQL contracts included")
          PY

      - name: Concurrent last-superadmin protection (disposable replay DB)
        working-directory: services/api
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CONVERGEO_DISPOSABLE_DB: "1"
        run: uv run python ../../scripts/ci/check-last-superadmin-concurrency.py

  db:
    name: Database / typegen drift
    needs: migrations
    runs-on: ubuntu-latest
    # config.toml uses env() substitution for the enabled send_sms auth hook and
    # Google OAuth provider. The Supabase CLI resolves these on `db start`, so the
    # job cannot bring the stack up without them and previously failed (which let
    # 0009's migration bugs merge past a red-but-bypassed check). These are dummy
    # CI-only values — never real secrets.
    env:
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktZHVtbXktc2VuZC1zbXMtaG9vay1zZWNyZXQtMDAw"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "ci-dummy-google-secret"
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: "ci-dummy-apple-secret"
      # Explicit typegen-only profile for supabase/postgres:17.6.1.143.
      EXPECTED_SERVER_VERSION_NUM: "170006"
      EXPECTED_VECTOR_VERSION: "0.8.2"
      EXPECTED_PG_GRAPHQL_VERSION: "1.6.1"
      EXPECTED_PGCRYPTO_VERSION: "1.3"
      EXPECTED_TYPEGEN_MIGRATION_COUNT: "139"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned (not `latest`) so setup-cli skips the unauthenticated
          # GitHub "resolve latest release" API call, which intermittently
          # hits rate limits and fails the db/rls/bundle jobs. Bump manually.
          version: 2.109.1

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Typegen helper negative controls
        run: |
          bash scripts/ci/test-typegen-contract.sh
          PYTHONPATH=scripts/ci python3 -m unittest scripts/ci/test_explicit_transaction_boundary.py

      - name: Prepare pinned Supabase-compatible database
        id: cart_typegen_reset
        run: |
          TYPEGEN_WORKDIR="$(mktemp -d)"
          echo "TYPEGEN_WORKDIR=${TYPEGEN_WORKDIR}" >> "${GITHUB_ENV}"
          bash scripts/ci/prepare-typegen-workdir.sh "${TYPEGEN_WORKDIR}"
          python3 scripts/ci/rehearse_explicit_transaction_profile.py "${TYPEGEN_WORKDIR}"

          TYPEGEN_DB_CONTAINER_ID="$(docker ps \
            --filter 'name=^/supabase_db_vergeo5-typegen$' \
            --format '{{.ID}}')"
          if [[ -z "${TYPEGEN_DB_CONTAINER_ID}" ]]; then
            echo "error: disposable Supabase database container was not found" >&2
            exit 1
          fi
          echo "TYPEGEN_DB_CONTAINER_ID=${TYPEGEN_DB_CONTAINER_ID}" >> "${GITHUB_ENV}"

      - name: Initialize disposable typegen GraphQL
        shell: bash
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          mkdir -p generated-types
          bash scripts/ci/initialize-typegen-graphql.sh \
            | tee generated-types/graphql-initialization.txt

      - name: Qualify migrations and Supabase database shape
        shell: bash
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          mkdir -p generated-types
          bash scripts/ci/qualify-typegen-database.sh \
            | tee generated-types/database-shape.txt

      - name: Verify service table ACL hardening in disposable database
        shell: bash
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/test-service-table-acl-hardening.sh

      - name: Prefetch pinned postgres-meta generator
        run: bash scripts/ci/prefetch-postgres-meta.sh

      - name: Preload qualified postgres-meta from official GHCR
        id: cart_typegen_meta
        run: bash scripts/ci/preload-typegen-meta.sh

      - name: Regenerate types
        id: cart_typegen_generate
        env:
          SUPABASE_TYPEGEN_SCHEMAS: public,graphql_public
        run: |
          SUPABASE_WORKDIR="${TYPEGEN_WORKDIR}" bash scripts/gen-types.sh
          cp packages/types/src/db.ts generated-types/db.first.ts
          SUPABASE_WORKDIR="${TYPEGEN_WORKDIR}" bash scripts/gen-types.sh
          cmp generated-types/db.first.ts packages/types/src/db.ts
          cp packages/types/src/db.ts generated-types/db.ts

      - name: Record generated type provenance
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_TYPEGEN_SCHEMAS: public,graphql_public
          TYPEGEN_OUTPUT: packages/types/src/db.ts
          PROVENANCE_OUTPUT: generated-types/provenance.txt
          TYPEGEN_GRAPHQL_INITIALIZATION_EVIDENCE: generated-types/graphql-initialization.txt
        run: |
          bash scripts/ci/record-typegen-provenance.sh

      - name: Upload generated database types
        uses: actions/upload-artifact@v7
        with:
          name: generated-database-types-${{ env.QUALIFICATION_SHA }}
          path: generated-types
          if-no-files-found: error
          retention-days: 3

      - name: Capture genuine generated types provenance
        id: cart_typegen_manifest
        if: ${{ !cancelled() && steps.cart_typegen_generate.outcome == 'success' }}
        env:
          TYPEGEN_GENERATION_OUTCOME: ${{ steps.cart_typegen_generate.outcome }}
          TYPEGEN_RESET_OUTCOME: ${{ steps.cart_typegen_reset.outcome }}
          TYPEGEN_META_OUTCOME: ${{ steps.cart_typegen_meta.outcome }}
        run: python3 scripts/ci/typegen_artifact.py capture

      - name: Fail on stale committed types
        run: git diff --exit-code packages/types/src/db.ts

      - name: Prove genuine generated types artifact is complete
        id: cart_typegen_proof
        if: always()
        env:
          TYPEGEN_GENERATION_OUTCOME: ${{ steps.cart_typegen_generate.outcome }}
          TYPEGEN_RESET_OUTCOME: ${{ steps.cart_typegen_reset.outcome }}
          TYPEGEN_META_OUTCOME: ${{ steps.cart_typegen_meta.outcome }}
        run: python3 scripts/ci/typegen_artifact.py verify

      - name: Upload genuine generated database types
        if: ${{ !cancelled() && steps.cart_typegen_generate.outcome == 'success' && steps.cart_typegen_manifest.outcome == 'success' && steps.cart_typegen_proof.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: cart-generated-types-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/types/src/db.ts
            typegen-artifact-manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Stop disposable Supabase database
        if: always()
        run: |
          if [[ -n "${TYPEGEN_WORKDIR:-}" && -f "${TYPEGEN_WORKDIR}/.owned-typegen-stack" ]]; then
            owned_id="$(cat "${TYPEGEN_WORKDIR}/.owned-typegen-stack")"
            current_id="$(docker ps --filter 'name=^/supabase_db_vergeo5-typegen$' --format '{{.ID}}')"
            if [[ "${owned_id}" =~ ^[0-9a-f]{12,64}$ && "${current_id}" == "${owned_id}" ]]; then
              supabase --workdir "${TYPEGEN_WORKDIR}" stop --no-backup
            fi
          fi

  rls:
    name: RLS isolation matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Same auth-hook/OAuth dummy env as db — stack cannot start without them.
    env:
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktZHVtbXktc2VuZC1zbXMtaG9vay1zZWNyZXQtMDAw"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "ci-dummy-google-secret"
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: "ci-dummy-apple-secret"
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Replay migrations
        working-directory: ${{ github.workspace }}
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash scripts/ci/migration-replay.sh

      # Provision the matrix's impersonation roles in ISOLATION, before any
      # pytest process touches the database. On 2026-08-02 the same bootstrap,
      # run from inside the session fixture, took the server down mid-statement
      # (run 30736920217) and one failure cascaded into 2,314 fixture errors —
      # with the actual culprit invisible. Here a crash or refusal fails this
      # single step, and the container logs print right next to it.
      - name: Provision RLS tester role
        run: |
          if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f ../../scripts/ci/provision-rls-tester.sql; then
            echo '::error::role provisioning failed — dumping database container logs'
            docker ps --format '{{.Names}}' | grep -i 'supabase_db' | head -1 | xargs -r docker logs --tail 100
            exit 1
          fi

      - name: Verify PostgreSQL/vector runtime and role shape
        run: |
          POSTGRES_CONTAINER_ID="$(docker ps --filter ancestor=pgvector/pgvector:0.8.0-pg17-trixie --format '{{.ID}}' | head -1)" \
            bash ../../scripts/ci/verify-postgres-runtime.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: DB-backed integration (curated, isolation-clean)
        run: uv run pytest tests/test_db_adapter.py tests/test_ticket_purchase.py tests/test_ticket_verify.py tests/test_ticket_wallet.py tests/test_ticket_scan_sync.py tests/test_ticket_transfer.py tests/test_event_release.py tests/test_search_analytics.py tests/test_service_escrow.py tests/test_vendor_analytics.py tests/test_review_aggregate.py tests/test_listing_below_median.py tests/test_kyc_state.py -q

      - name: RLS isolation matrix
        # BLOCKING since R02 (2026-08-01). The `continue-on-error: true` here
        # dated from M03-P09, when tests/rls did not exist yet — the suite has
        # long since landed and passes, but the escape hatch stayed. That meant
        # a genuine RLS regression — customer data readable by another
        # customer, a vendor reading a rival's orders — would have gone GREEN.
        #
        # RLS is the only thing standing between tenants in this product, so a
        # gate that cannot fail is not a gate. If this proves flaky, the fix is
        # to stabilise the environment, not to hide the signal again.
        run: uv run pytest tests/rls -q

