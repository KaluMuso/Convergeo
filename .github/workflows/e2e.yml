name: E2E (Playwright · staging)

# Staging-dependent suite — NOT a required per-PR gate. Runs nightly against the
# deployed staging target and on demand before a release. The customer flows run
# on any live target; the Lenco-sandbox pay and WhatsApp-mock legs only activate
# when their secrets are present (founder gate F9b).
on:
  schedule:
    # 02:30 UTC nightly.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override E2E_BASE_URL (else uses the E2E_BASE_URL secret)"
        required: false
        type: string
      expect_sha:
        description: "Release-candidate SHA for strict buildId proof (default GITHUB_SHA)"
        required: false
        type: string
      pre_release:
        description: "Pre-release gate run (enables strict SHA verification)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright critical paths (Fast-3G · 360px)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      # Canonical staging customer origin — set repository secret E2E_BASE_URL to
      # match staging environment STAGING_CUSTOMER_URL (Vercel Preview on branch staging).
      E2E_BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
      E2E_VENDOR_BASE_URL: ${{ secrets.E2E_VENDOR_BASE_URL }}
      E2E_ADMIN_BASE_URL: ${{ secrets.E2E_ADMIN_BASE_URL }}
      E2E_LOCALE: en
      # Vercel Deployment Protection bypass for automation (header — never in URLs).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_EXPECT_SHA: ${{ inputs.expect_sha || github.sha }}
      E2E_STRICT_SHA: ${{ inputs.pre_release && 'true' || '' }}
      CERTIFICATION_MODE: ${{ inputs.pre_release && 'integrated-staging' || '' }}
      # Deterministic seed reset (staging-only, token-guarded).
      E2E_SEED_RESET_URL: ${{ secrets.E2E_SEED_RESET_URL }}
      E2E_SEED_TOKEN: ${{ secrets.E2E_SEED_TOKEN }}
      # OTP test creds (Supabase staging test-OTP map).
      E2E_TEST_PHONE: ${{ secrets.E2E_TEST_PHONE }}
      E2E_TEST_OTP: ${{ secrets.E2E_TEST_OTP }}
      E2E_TICKET_QR: ${{ secrets.E2E_TICKET_QR }}
      # Lenco sandbox pay leg — founder gate F9b. Absent secrets => leg skips.
      LENCO_SANDBOX: ${{ secrets.LENCO_SANDBOX }}
      LENCO_SANDBOX_PUBLIC_KEY: ${{ secrets.LENCO_SANDBOX_PUBLIC_KEY }}
      LENCO_SANDBOX_SECRET_KEY: ${{ secrets.LENCO_SANDBOX_SECRET_KEY }}
      LENCO_SANDBOX_MOMO_NUMBER: ${{ secrets.LENCO_SANDBOX_MOMO_NUMBER }}
      # WhatsApp mock adapter outbox.
      WHATSAPP_MOCK: ${{ secrets.WHATSAPP_MOCK }}
      WHATSAPP_MOCK_OUTBOX_URL: ${{ secrets.WHATSAPP_MOCK_OUTBOX_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard — E2E_BASE_URL must be set
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "::error::E2E_BASE_URL not set — staging E2E blocked. Set repository secret E2E_BASE_URL to the canonical staging customer Preview URL (same value as staging environment STAGING_CUSTOMER_URL), or pass workflow_dispatch input base_url."
            exit 1
          fi
          case "${E2E_BASE_URL}" in
            *localhost*|*127.0.0.1*) echo "::error::E2E_BASE_URL must be the deployed staging customer surface, not localhost"; exit 1 ;;
          esac
          host="$(printf '%s' "${E2E_BASE_URL}" | sed -E 's#^https?://##; s#/.*##')"
          echo "staging customer host=${host}"

      - name: Probe staging customer (identity + protection)
        run: node scripts/ci/e2e-staging-probe.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install E2E deps (frozen lockfile)
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        # Playwright has a 15-minute global timeout, but retain an independent
        # process deadline so a stuck runner cannot consume a staging gate
        # indefinitely if the test runner watchdog does not get to exit.
        run: timeout --signal=TERM --kill-after=60s 18m npx playwright test

      - name: Guard — browser tests must have executed
        if: success()
        run: node scripts/ci/verify-e2e-executed.mjs e2e/results/results.json

      - name: Upload trace/video artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/results
          retention-days: 14
          if-no-files-found: ignore
