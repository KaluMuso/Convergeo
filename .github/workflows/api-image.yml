name: API image (GHCR)

# Builds the FastAPI service image on GitHub's runners (7GB RAM) and pushes it to
# GHCR, so resource-constrained hosts (e.g. the OCI micro VM) only need a light
# `docker pull` — no in-place build, no OOM risk to co-tenant services.

on:
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "infra/api.Dockerfile"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source commit SHA for a branch-only image
        required: false
        type: string

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/convergeo-api" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            API_IMAGE_TAG=${{ github.sha }}
          # amd64 for the x86 micro VM; arm64 for a potential A1.Flex free box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-kyc-sha:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/cursor/kyc-bootstrap-empty-20261008' &&
      github.repository == 'KaluMuso/Convergeo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bind source SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install locked API dependencies
        working-directory: services/api
        run: uv sync --frozen --dev

      - name: Recheck KYC bootstrap regression
        working-directory: services/api
        run: uv run --frozen pytest -q tests/test_vendor_onboarding_beta.py
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish only the source SHA tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            API_IMAGE_TAG=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kalumuso/convergeo-api:${{ github.sha }}
          cache-from: type=gha
