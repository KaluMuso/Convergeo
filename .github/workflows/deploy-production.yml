name: Deploy production

# Founder/ops workflow: pin-redeploy API on Hetzner + promote Vercel frontends.
# Never auto-runs on push — explicit workflow_dispatch only.
#
# Required GitHub Environment: `production` with secrets:
#   PRODUCTION_API_SSH_HOST   (e.g. 91.107.236.37)
#   PRODUCTION_API_SSH_USER   (e.g. root)
#   PRODUCTION_API_SSH_KEY    (PEM private key)
#   VERCEL_TOKEN
#   VERCEL_TEAM_ID            (team_I2OEqmMjTwN2k5g7ACbQW705)
# Optional:
#   VERCEL_PROJECT_ID_VENDOR  (default in vercel_promote.sh)
#   VERCEL_PROJECT_ID_ADMIN

on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: "Exact 40-character SHA of this master checkout; API and frontends must match."
        required: true
        type: string
      skip_api:
        description: "Skip Hetzner API redeploy"
        required: false
        type: boolean
        default: false
      skip_vercel:
        description: "Skip Vercel vendor/admin promote"
        required: false
        type: boolean
        default: false
      verify_live:
        description: "Run scripts/ops/verify_live.sh after deploy"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_API_HOST: api.vergeo5.com
  PROD_SUPABASE_PROJECT_REF: dpadrlxukcjbewpqympu

jobs:
  guard:
    name: Guard inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require exact master deployment identity
        env:
          IMAGE_TAG: ${{ inputs.api_image_tag }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$GITHUB_SHA" ]; then
            echo "::error::checkout does not match the workflow SHA"
            exit 1
          fi
          python3 scripts/ci/production_deploy_identity.py request \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --source-sha "$checkout_sha" \
            --image-tag "$IMAGE_TAG"

  deploy-api:
    name: Redeploy API (Hetzner)
    needs: guard
    if: ${{ inputs.skip_api != true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy SHA-tagged image via SSH
        env:
          PRODUCTION_API_SSH_HOST: ${{ secrets.PRODUCTION_API_SSH_HOST }}
          PRODUCTION_API_SSH_USER: ${{ secrets.PRODUCTION_API_SSH_USER }}
          PRODUCTION_API_SSH_KEY: ${{ secrets.PRODUCTION_API_SSH_KEY }}
          IMAGE_TAG: ${{ inputs.api_image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_API_SSH_HOST}" || -z "${PRODUCTION_API_SSH_KEY}" ]]; then
            echo "::error::PRODUCTION_API_SSH_HOST / PRODUCTION_API_SSH_KEY required in production environment"
            exit 1
          fi
          user="${PRODUCTION_API_SSH_USER:-root}"
          trap 'rm -f /tmp/prod_api_key' EXIT
          install -m 600 /dev/null /tmp/prod_api_key
          printf '%s\n' "${PRODUCTION_API_SSH_KEY}" > /tmp/prod_api_key

          scp -i /tmp/prod_api_key -o StrictHostKeyChecking=accept-new \
            infra/redeploy-api.sh \
            "${user}@${PRODUCTION_API_SSH_HOST}:/tmp/redeploy-api.sh"

          ssh -i /tmp/prod_api_key -o StrictHostKeyChecking=accept-new \
            "${user}@${PRODUCTION_API_SSH_HOST}" \
            "chmod +x /tmp/redeploy-api.sh && bash /tmp/redeploy-api.sh '${IMAGE_TAG}'"

          rm -f /tmp/prod_api_key

  verify-api-identity:
    name: Verify exact production API identity (read-only)
    needs: [guard, deploy-api]
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
       (needs.deploy-api.result == 'skipped' && inputs.skip_api == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fingerprint probe
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://${PROD_API_HOST}/fingerprint" -o "$RUNNER_TEMP/fingerprint.json"
          python3 scripts/ci/production_deploy_identity.py fingerprint \
            --fingerprint-file "$RUNNER_TEMP/fingerprint.json" \
            --expected-sha "$WANT_SHA" \
            --expected-project "$PROD_SUPABASE_PROJECT_REF"
        env:
          WANT_SHA: ${{ inputs.api_image_tag }}

      - name: Upload API deploy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-api-fingerprint
          path: ${{ runner.temp }}/fingerprint.json
          if-no-files-found: ignore

  promote-vercel:
    name: Promote vendor + admin
    needs: [guard, verify-api-identity]
    if: >-
      !cancelled() &&
      needs.guard.result == 'success' &&
      needs.verify-api-identity.result == 'success' &&
      inputs.skip_vercel == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Promote frontends to master tip
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          MASTER_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::VERCEL_TOKEN required in production environment"
            exit 1
          fi
          bash scripts/ops/vercel_promote.sh --project vendor
          bash scripts/ops/vercel_promote.sh --project admin

  verify:
    name: Post-deploy verify
    needs: [guard, deploy-api, promote-vercel, verify-api-identity]
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      needs.verify-api-identity.result == 'success' &&
      inputs.verify_live == true &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.promote-vercel.result == 'success' || needs.promote-vercel.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: verify_live.sh
        env:
          MASTER_GIT_SHA: ${{ inputs.api_image_tag }}
          EXPECTED_ENV: production
          EXPECTED_IMAGE_TAG: ${{ inputs.api_image_tag }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ env.PROD_SUPABASE_PROJECT_REF }}
        run: bash scripts/ops/verify_live.sh
