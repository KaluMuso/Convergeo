name: Deploy staging

# Manually controlled staging pipeline. Never auto-promotes to production.
#
# Triggers:
#   - workflow_dispatch (explicit)
#   - push to the protected `staging` branch (controlled branch deploy)
#
# Required GitHub Environment: `staging` (protection rules + secrets).
# Secret *names* only below — values live in the environment, never in git.

on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: "Immutable API image tag (git SHA). Leave empty to use this commit."
        required: false
        type: string
      skip_vercel:
        description: "Skip Vercel Preview env sync / deploy trigger"
        required: false
        type: boolean
        default: false
      skip_migrate:
        description: "Skip Supabase migration apply (use when DB already current)"
        required: false
        type: boolean
        default: false
      seed_synthetic:
        description: "Run synthetic staging seed (stg-rv-*) after migrations"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

env:
  # Public production identifiers — staging jobs must never equal these.
  PROD_SUPABASE_PROJECT_REF: dpadrlxukcjbewpqympu
  PROD_API_HOST: api.vergeo5.com

jobs:
  environment-separation:
    name: Environment separation
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Refuse missing staging identifiers
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_SUPABASE_PROJECT_ID}" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_ID secret is required in the staging environment"
            exit 1
          fi
          if [ -z "${STAGING_API_HOST}" ]; then
            echo "::error::STAGING_API_HOST secret is required in the staging environment"
            exit 1
          fi

      - name: Compare staging identifiers against production
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_N8N_WEBHOOK_URL: ${{ secrets.STAGING_N8N_WEBHOOK_URL }}
          STAGING_CUSTOMER_URL: ${{ secrets.STAGING_CUSTOMER_URL }}
          STAGING_VENDOR_URL: ${{ secrets.STAGING_VENDOR_URL }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
        run: bash scripts/ci/check-staging-separation.sh

      - name: Hard-fail on production Supabase ref or API host literals
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          set -euo pipefail
          if [ "${STAGING_SUPABASE_PROJECT_ID}" = "${PROD_SUPABASE_PROJECT_REF}" ]; then
            echo "::error::staging Supabase project equals production"
            exit 1
          fi
          host="$(printf '%s' "${STAGING_API_HOST}" | sed -E 's#^https?://##; s#/.*##; s/:.*//')"
          if [ "${host}" = "${PROD_API_HOST}" ]; then
            echo "::error::staging API host equals production api.vergeo5.com"
            exit 1
          fi

  migrate-supabase:
    name: Supabase migrations + checks
    needs: environment-separation
    if: ${{ github.event_name == 'push' || inputs.skip_migrate != true }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Link staging project (not production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${STAGING_SUPABASE_PROJECT_ID}" = "${PROD_SUPABASE_PROJECT_REF}" ]; then
            echo "::error::refusing to link production Supabase project"
            exit 1
          fi
          supabase link \
            --project-ref "${STAGING_SUPABASE_PROJECT_ID}" \
            --password "${STAGING_SUPABASE_DB_PASSWORD}"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: READ-ONLY live ledger capture + schema-convergence preflight
        env:
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          STAGING_SUPABASE_REGION: ${{ vars.STAGING_SUPABASE_REGION || 'eu-west-1' }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_SUPABASE_DB_URL}" ]; then
            export SUPABASE_DB_URL="${STAGING_SUPABASE_DB_URL}"
          else
            export SUPABASE_DB_URL="postgresql://postgres.${STAGING_SUPABASE_PROJECT_ID}:${STAGING_SUPABASE_DB_PASSWORD}@aws-0-${STAGING_SUPABASE_REGION}.pooler.supabase.com:5432/postgres"
          fi
          bash scripts/ci/check-db-reachable.sh
          cp /dev/null /tmp/staging-ledger-preflight.txt
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tA -c \
            'select version from supabase_migrations.schema_migrations order by version' \
            | tee /tmp/staging-ledger-preflight.txt
          test -s /tmp/staging-ledger-preflight.txt
          SCHEMA_TARGET_KIND=sandbox \
          SCHEMA_TARGET_PROJECT_REF="${STAGING_SUPABASE_PROJECT_ID}" \
          SUPABASE_DB_URL="${SUPABASE_DB_URL}" \
          EXPECTED_SOURCE_SHA="${EXPECTED_SOURCE_SHA}" \
          bash scripts/ci/preflight-staging-schema-convergence.sh \
            | tee /tmp/staging-schema-convergence-plan.json
          if grep -q '"ledger_repair_required": true' /tmp/staging-schema-convergence-plan.json; then
            echo "::error::STAGING_LEDGER_REPAIR_REQUIRED — sandbox migration ledger drift must be normalized before db push (see docs/production-readiness/2026-08-13/staging-ledger-repair-plan.md)"
            exit 1
          fi
          if grep -q '"schema_repair_required": true' /tmp/staging-schema-convergence-plan.json; then
            echo "::error::STAGING_SCHEMA_REPAIR_REQUIRED — sandbox physical schema drift must be resolved before db push (see scripts/ci/staging-physical-parity-manifest.json)"
            exit 1
          fi

      - name: Push migrations from blank/current staging DB
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SEND_SMS_HOOK_SECRET:-}" ]; then
            echo "::error::SEND_SMS_HOOK_SECRET secret is required in the staging environment"
            exit 1
          fi
          if ! printf '%s' "${SEND_SMS_HOOK_SECRET}" | grep -Eq '^v1,whsec_[A-Za-z0-9+/=_-]{32,}$'; then
            echo "::error::SEND_SMS_HOOK_SECRET must match v1,whsec_<base64-secret>"
            exit 1
          fi
          # Applies repository migrations (including 0056) to the linked staging project.
          supabase db push --include-all

      - name: Reconcile repository migrations against remote ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          STAGING_SUPABASE_REGION: ${{ vars.STAGING_SUPABASE_REGION || 'eu-west-1' }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_SUPABASE_DB_URL}" ]; then
            export SUPABASE_DB_URL="${STAGING_SUPABASE_DB_URL}"
          else
            export SUPABASE_DB_URL="postgresql://postgres.${STAGING_SUPABASE_PROJECT_ID}:${STAGING_SUPABASE_DB_PASSWORD}@aws-0-${STAGING_SUPABASE_REGION}.pooler.supabase.com:5432/postgres"
          fi
          bash scripts/ci/check-db-reachable.sh
          supabase migration list | tee /tmp/migration-list.txt
          bash scripts/ci/reconcile-staging-migrations.sh

      - name: Generate types against staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Generate into a temp file — staging may be ahead of committed types during rollout.
          supabase gen types typescript \
            --project-id "${STAGING_SUPABASE_PROJECT_ID}" \
            --schema public > /tmp/staging-db.ts
          test -s /tmp/staging-db.ts
          echo "Staging typegen produced $(wc -l < /tmp/staging-db.ts) lines"

      - name: Schema / RLS + security_invoker view checks
        env:
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          STAGING_SUPABASE_REGION: ${{ vars.STAGING_SUPABASE_REGION || 'eu-west-1' }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_SUPABASE_DB_URL}" ]; then
            export SUPABASE_DB_URL="${STAGING_SUPABASE_DB_URL}"
          else
            # Fallback: SESSION POOLER (IPv4). GitHub-hosted runners have no
            # IPv6 egress and the direct host db.<ref>.supabase.co is IPv6-only.
            # Region must match the project — staging (vergeo-sandbox) is
            # eu-west-1; production is eu-north-1. Override via the repo
            # variable STAGING_SUPABASE_REGION when it moves.
            export SUPABASE_DB_URL="postgresql://postgres.${STAGING_SUPABASE_PROJECT_ID}:${STAGING_SUPABASE_DB_PASSWORD}@aws-0-${STAGING_SUPABASE_REGION}.pooler.supabase.com:5432/postgres"
          fi
          # Diagnose an unreachable database in one line instead of a bare
          # "Network is unreachable" (Deploy staging run 30695764799).
          bash scripts/ci/check-db-reachable.sh
          bash scripts/ci/check-staging-schema.sh

      - name: Setup uv (synthetic seed — Auth Admin API client)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_synthetic }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python (synthetic seed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_synthetic }}
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API dependencies (synthetic seed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_synthetic }}
        working-directory: services/api
        run: uv sync --dev

      - name: Synthetic seed (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_synthetic }}
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          # Step-scoped ONLY. Required to provision canonical Auth personas
          # through the Supabase Auth Admin API — never a job-level env var,
          # never a repository secret.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # --cleanup before --apply: ensure_auth_personas() (called by
          # --apply) repairs a contract-mismatched persona via the Auth
          # Admin API's delete_user()+create_user(), which restrict-FK-fails
          # while that persona's own canonical public dependants (profiles,
          # tickets, ...) still exist. --cleanup removes those dependants —
          # and, absent real transactional evidence, the stale auth.users row
          # itself — before persona repair ever runs, matching e2e.yml's
          # already-correct order. See
          # test_legacy_identity_less_persona_recreation_is_safe_only_after_cleanup
          # (test_seed_staging.py) for the proof, including that real-order
          # protection stays fail-closed.
          uv run --project services/api python3 scripts/seed_staging.py --env staging --cleanup --apply

  deploy-edge-functions:
    name: Supabase edge functions (staging)
    needs: [environment-separation, migrate-supabase]
    if: ${{ always() && needs.environment-separation.result == 'success' && (needs.migrate-supabase.result == 'success' || needs.migrate-supabase.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Deploy send-sms-otp to staging (signed webhook, no JWT)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "${STAGING_SUPABASE_PROJECT_ID}" = "${PROD_SUPABASE_PROJECT_REF}" ]; then
            echo "::error::refusing to deploy edge functions to production Supabase project"
            exit 1
          fi
          echo "Operator gate: confirm Supabase edge secrets AT_ENVIRONMENT matches AT credential class (SANDBOX vs LIVE) before enabling SMS."
          supabase functions deploy send-sms-otp \
            --project-ref "${STAGING_SUPABASE_PROJECT_ID}" \
            --no-verify-jwt

      - name: Prove send-sms-otp is active on staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${STAGING_SUPABASE_PROJECT_ID}" | tee /tmp/staging-edge-functions.txt
          if ! grep -q 'send-sms-otp' /tmp/staging-edge-functions.txt; then
            echo "::error::send-sms-otp not present after deploy"
            exit 1
          fi
          if ! grep -E 'send-sms-otp.*ACTIVE|ACTIVE.*send-sms-otp' /tmp/staging-edge-functions.txt; then
            echo "::error::send-sms-otp is not ACTIVE after deploy"
            cat /tmp/staging-edge-functions.txt
            exit 1
          fi
          mkdir -p /tmp/staging-evidence
          cat > /tmp/staging-evidence/edge-function-deploy.txt <<EOF
          function=send-sms-otp
          project_ref=${STAGING_SUPABASE_PROJECT_ID}
          sha=${EXPECTED_SOURCE_SHA}
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat /tmp/staging-evidence/edge-function-deploy.txt

      - name: Upload edge function deploy evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-edge-function-deploy-record-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/staging-evidence/edge-function-deploy.txt

  build-api-image:
    name: Build API image (SHA tag)
    needs: environment-separation
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_name: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve immutable image tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.api_image_tag || github.sha }}"
          if [ "$TAG" = "latest" ]; then
            echo "::error::refusing image tag 'latest'"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/convergeo-api" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push SHA-tagged image (no latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api-oci:
    name: Deploy API to OCI staging
    needs: [environment-separation, build-api-image, migrate-supabase, deploy-edge-functions]
    # Allow deploy when migrate or edge-function deploy was skipped via workflow_dispatch.
    if: ${{ always() && needs.environment-separation.result == 'success' && needs.build-api-image.result == 'success' && (needs.migrate-supabase.result == 'success' || needs.migrate-supabase.result == 'skipped') && (needs.deploy-edge-functions.result == 'success' || needs.deploy-edge-functions.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Deploy SHA-tagged image via SSH
        env:
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_OCI_SSH_HOST: ${{ secrets.STAGING_OCI_SSH_HOST }}
          STAGING_OCI_SSH_USER: ${{ secrets.STAGING_OCI_SSH_USER }}
          STAGING_OCI_SSH_KEY: ${{ secrets.STAGING_OCI_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-api-image.outputs.image_tag }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "${STAGING_API_HOST}" | sed -E 's#^https?://##; s#/.*##')"
          if [ "$host" = "api.vergeo5.com" ]; then
            echo "::error::refusing to deploy to production API host"
            exit 1
          fi
          if [ -z "${STAGING_OCI_SSH_HOST}" ] || [ -z "${STAGING_OCI_SSH_KEY}" ]; then
            echo "::error::STAGING_OCI_SSH_HOST / STAGING_OCI_SSH_KEY required for OCI staging deploy"
            exit 1
          fi
          if [ "${IMAGE_TAG}" = "latest" ]; then
            echo "::error::refusing latest tag"
            exit 1
          fi

          install -m 600 /dev/null /tmp/staging_oci_key
          printf '%s\n' "${STAGING_OCI_SSH_KEY}" > /tmp/staging_oci_key

          # Copy redeploy script and run with SHA tag. Env file on the host is
          # ~/vergeo5-api-staging.env (never written by CI).
          scp -i /tmp/staging_oci_key -o StrictHostKeyChecking=accept-new \
            infra/staging/redeploy-api-staging.sh \
            "${STAGING_OCI_SSH_USER}@${STAGING_OCI_SSH_HOST}:/tmp/redeploy-api-staging.sh"

          ssh -i /tmp/staging_oci_key -o StrictHostKeyChecking=accept-new \
            "${STAGING_OCI_SSH_USER}@${STAGING_OCI_SSH_HOST}" \
            "bash /tmp/redeploy-api-staging.sh '${IMAGE_TAG}'"

          rm -f /tmp/staging_oci_key

      - name: Record deployment
        run: |
          mkdir -p /tmp/staging-evidence
          cat > /tmp/staging-evidence/api-deploy.txt <<EOF
          image=${{ needs.build-api-image.outputs.image_name }}:${{ needs.build-api-image.outputs.image_tag }}
          sha=${{ github.sha }}
          host_secret=STAGING_API_HOST
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat /tmp/staging-evidence/api-deploy.txt

      - name: Upload deploy record
        uses: actions/upload-artifact@v7
        with:
          name: staging-api-deploy-record-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/staging-evidence/api-deploy.txt

  prove-vercel-preview:
    name: Vercel Preview proof (${{ matrix.portal }})
    needs: [environment-separation, deploy-api-oci]
    if: ${{ always() && needs.environment-separation.result == 'success' && needs.deploy-api-oci.result == 'success' && (github.event_name == 'push' || inputs.skip_vercel != true) }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        # `bypass_secret_name` lets each leg pull ONLY its own project's Vercel
        # Protection Bypass for Automation secret (secrets are per Vercel
        # project; the three portals are three projects). A job never receives
        # the other two portals' secrets.
        include:
          - portal: customer
            project_secret_name: VERCEL_PROJECT_ID_CUSTOMER
            bypass_secret_name: VERCEL_AUTOMATION_BYPASS_SECRET_CUSTOMER
          - portal: vendor
            project_secret_name: VERCEL_PROJECT_ID_VENDOR
            bypass_secret_name: VERCEL_AUTOMATION_BYPASS_SECRET_VENDOR
          - portal: admin
            project_secret_name: VERCEL_PROJECT_ID_ADMIN
            bypass_secret_name: VERCEL_AUTOMATION_BYPASS_SECRET_ADMIN
    steps:
      - uses: actions/checkout@v7

      - name: Guard Preview API URL
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          set -euo pipefail
          api="${STAGING_API_BASE_URL:-https://${STAGING_API_HOST}}"
          case "$api" in
            *api.vergeo5.com*) echo "::error::Preview must not use production API"; exit 1 ;;
            *localhost*) echo "::error::Preview must not use localhost"; exit 1 ;;
          esac
          echo "Preview API base OK (host secret only)"
          test -f infra/staging/vercel-preview.env.example

      - name: Read authenticated prior-attempt checkpoint
        id: prior_checkpoint
        if: ${{ github.run_attempt > 1 }}
        uses: actions/github-script@v8
        env:
          PORTAL: ${{ matrix.portal }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const portal = process.env.PORTAL;
            const currentAttempt = Number(process.env.CURRENT_ATTEMPT);
            const runId = context.runId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (!['customer', 'vendor', 'admin'].includes(portal) ||
                !Number.isSafeInteger(currentAttempt) || currentAttempt <= 1) {
              core.setFailed('invalid checkpoint lookup identity');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: runId, per_page: 100,
            });
            for (let sourceAttempt = currentAttempt - 1; sourceAttempt >= 1; sourceAttempt -= 1) {
              const expectedName = `staging-preview-checkpoint-${portal}-${runId}-attempt-${sourceAttempt}`;
              const matches = artifacts.filter((artifact) => artifact.name === expectedName);
              if (matches.length > 1) {
                core.setFailed('ambiguous prior-attempt checkpoint artifact');
                return;
              }
              if (matches.length === 0 || matches[0].expired === true) continue;
              const artifact = matches[0];
              if (!Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 ||
                  artifact.size_in_bytes > 256 * 1024 ||
                  !/^sha256:[0-9a-f]{64}$/.test(artifact.digest || '')) {
                core.setFailed('invalid prior-attempt checkpoint artifact metadata');
                return;
              }
              const runResponse = await github.request(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
                { owner, repo, run_id: runId, attempt_number: sourceAttempt },
              );
              const run = runResponse.data;
              if (run.id !== runId || run.head_sha !== context.sha || run.head_branch !== 'staging' ||
                  run.path !== '.github/workflows/deploy-staging.yml' ||
                  run.repository?.id !== 1290591718 ||
                  run.repository?.full_name !== 'KaluMuso/Convergeo') {
                core.setFailed('untrusted prior-attempt checkpoint producer');
                return;
              }
              const jobs = await github.paginate(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
                { owner, repo, run_id: runId, attempt_number: sourceAttempt, per_page: 100 },
              );
              const expectedJob = `Vercel Preview proof (${portal})`;
              const sourceJobs = jobs.filter((job) =>
                job.name === expectedJob || job.name.endsWith(` / ${expectedJob}`)
              );
              if (sourceJobs.length !== 1 || sourceJobs[0].status !== 'completed') {
                core.setFailed('checkpoint is not bound to one completed prior-attempt job');
                return;
              }
              const sourceJob = sourceJobs[0];
              const createdAt = Date.parse(artifact.created_at);
              if (!Number.isFinite(createdAt) || createdAt < Date.parse(sourceJob.started_at) ||
                  createdAt > Date.parse(sourceJob.completed_at)) {
                core.setFailed('checkpoint artifact falls outside its producer job window');
                return;
              }
              const download = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: 'zip',
              });
              const archive = Buffer.from(download.data);
              const digest = `sha256:${crypto.createHash('sha256').update(archive).digest('hex')}`;
              if (digest !== artifact.digest) {
                core.setFailed('checkpoint artifact digest mismatch');
                return;
              }
              const directory = path.join(process.env.RUNNER_TEMP, `checkpoint-${portal}`);
              fs.mkdirSync(directory, { recursive: true });
              fs.writeFileSync(path.join(directory, 'prior.zip'), archive);
              fs.writeFileSync(path.join(directory, 'artifact.json'), JSON.stringify({
                ...artifact,
                workflow_run: {
                  id: run.id,
                  head_sha: run.head_sha,
                  head_branch: run.head_branch,
                  repository: run.repository.full_name,
                  repository_id: run.repository.id,
                  path: run.path,
                },
                source_job: { ...sourceJob, run_attempt: sourceAttempt },
              }));
              core.setOutput('found', 'true');
              core.setOutput('source_attempt', String(sourceAttempt));
              return;
            }
            core.info('no reusable prior-attempt checkpoint artifact found');
            core.setOutput('found', 'false');

      - name: Resolve create versus reuse
        id: checkpoint_selection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_CUSTOMER: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}
          VERCEL_PROJECT_ID_VENDOR: ${{ secrets.VERCEL_PROJECT_ID_VENDOR }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          # Deployment Protection bypass, scoped by the matrix to THIS portal's
          # Vercel project only. The probe sends it as a header
          # (x-vercel-protection-bypass) — never a URL or query parameter — and
          # it is masked by Actions, so it cannot reach the logs or evidence.
          VERCEL_PORTAL_BYPASS_SECRET: ${{ secrets[matrix.bypass_secret_name] }}
          # Backward-compatible fallback for portals whose project-specific
          # secret has not been created yet (see docs/ops/vercel-deployment-protection.md).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Customer portal only, opt-in (docs/ops/staging-samesite-guest-cart.md):
          # absent until an operator completes the one-time DNS + Vercel
          # custom-domain setup, at which point the script aliases this
          # SHA-proven deployment to it. A no-op for vendor/admin regardless.
          CUSTOMER_STAGING_STABLE_HOSTNAME: ${{ vars.CUSTOMER_STAGING_STABLE_HOSTNAME }}
          STAGING_BUILD_CONFIG_REVISION: ${{ vars.STAGING_BUILD_CONFIG_REVISION }}
          PROJECT_ID: ${{ secrets[matrix.project_secret_name] }}
          PRIOR_CHECKPOINT_FOUND: ${{ steps.prior_checkpoint.outputs.found }}
          PRIOR_CHECKPOINT_ATTEMPT: ${{ steps.prior_checkpoint.outputs.source_attempt }}
        run: |
          set -euo pipefail
          selection="/tmp/staging-preview-${{ matrix.portal }}/checkpoint-selection.json"
          args=(
            select
            --portal "${{ matrix.portal }}"
            --project-id "${PROJECT_ID}"
            --candidate-sha "${GITHUB_SHA}"
            --configuration-revision "${STAGING_BUILD_CONFIG_REVISION}"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --output "${selection}"
          )
          if [ "${PRIOR_CHECKPOINT_FOUND}" = "true" ]; then
            args+=(
              --archive "${RUNNER_TEMP}/checkpoint-${{ matrix.portal }}/prior.zip"
              --artifact-metadata "${RUNNER_TEMP}/checkpoint-${{ matrix.portal }}/artifact.json"
              --source-attempt "${PRIOR_CHECKPOINT_ATTEMPT}"
            )
          fi
          python3 scripts/ci/vercel_deployment_checkpoint.py "${args[@]}"

      - name: Create or recover Preview checkpoint
        id: prepare_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_CUSTOMER: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}
          VERCEL_PROJECT_ID_VENDOR: ${{ secrets.VERCEL_PROJECT_ID_VENDOR }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_BUILD_CONFIG_REVISION: ${{ vars.STAGING_BUILD_CONFIG_REVISION }}
        run: |
          set -euo pipefail
          bash scripts/ci/vercel-staging-preview-prove.sh \
            --portal "${{ matrix.portal }}" \
            --output-dir "/tmp/staging-preview-${{ matrix.portal }}" \
            --phase prepare \
            --selection-file "/tmp/staging-preview-${{ matrix.portal }}/checkpoint-selection.json" \
            --checkpoint-file "/tmp/staging-preview-${{ matrix.portal }}/deployment-checkpoint.json"

      # This PRE_PROBE artifact is intentionally persisted before any health or
      # Customer alias probe. It enables retry reuse but can never certify PASS.
      - name: Upload PRE_PROBE checkpoint (${{ matrix.portal }})
        uses: actions/upload-artifact@v7
        with:
          name: staging-preview-checkpoint-${{ matrix.portal }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/staging-preview-${{ matrix.portal }}/deployment-checkpoint.json
          retention-days: 7
          if-no-files-found: error

      - name: Re-probe immutable Preview and mutable Customer hostname
        id: prove_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_CUSTOMER: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}
          VERCEL_PROJECT_ID_VENDOR: ${{ secrets.VERCEL_PROJECT_ID_VENDOR }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_BUILD_CONFIG_REVISION: ${{ vars.STAGING_BUILD_CONFIG_REVISION }}
          VERCEL_PORTAL_BYPASS_SECRET: ${{ secrets[matrix.bypass_secret_name] }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CUSTOMER_STAGING_STABLE_HOSTNAME: ${{ vars.CUSTOMER_STAGING_STABLE_HOSTNAME }}
        run: |
          set -euo pipefail
          bash scripts/ci/vercel-staging-preview-prove.sh \
            --portal "${{ matrix.portal }}" \
            --output-dir "/tmp/staging-preview-${{ matrix.portal }}" \
            --phase prove \
            --checkpoint-file "/tmp/staging-preview-${{ matrix.portal }}/deployment-checkpoint.json"

      - name: Publish deployment create/reuse count (${{ matrix.portal }})
        if: ${{ always() }}
        env:
          PREPARE_OUTCOME: ${{ steps.prepare_preview.outcome }}
          PROVE_OUTCOME: ${{ steps.prove_preview.outcome }}
          DEPLOYMENT_ACTION: ${{ steps.prepare_preview.outputs.deployment_action }}
          CREATE_CALLS: ${{ steps.prepare_preview.outputs.deployment_create_calls }}
          REUSED_DEPLOYMENTS: ${{ steps.prepare_preview.outputs.reused_deployments }}
        run: |
          set +e
          {
            echo "### Vercel checkpoint — ${{ matrix.portal }}"
            echo
            echo "- Candidate: \`${GITHUB_SHA}\`"
            echo "- Configuration revision: recorded (non-secret identity)"
            echo "- Checkpoint stage: \`PRE_PROBE\` (not certification evidence)"
            echo "- Decision: \`${DEPLOYMENT_ACTION:-UNKNOWN}\`"
            echo "- Deployment-create calls: \`${CREATE_CALLS:-UNKNOWN}\`"
            echo "- Reused deployments: \`${REUSED_DEPLOYMENTS:-UNKNOWN}\`"
            echo "- Prepare/prove: \`${PREPARE_OUTCOME}/${PROVE_OUTCOME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0

      # Failure diagnostics are deliberately outside staging-preview-evidence-*
      # consumed by smoke/certification. Never upload the whole probe directory:
      # it also holds raw health responses, headers and curl diagnostics.
      - name: Upload alias diagnostics (${{ matrix.portal }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-alias-diagnostics-${{ matrix.portal }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/staging-preview-${{ matrix.portal }}/stable-health-diagnostics.json
          if-no-files-found: ignore

      - name: Upload Preview evidence (${{ matrix.portal }})
        uses: actions/upload-artifact@v7
        with:
          name: staging-preview-evidence-${{ matrix.portal }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          # Only the allowlisted certification projection, not the raw Vercel
          # deployment response (which can include environment configuration).
          path: /tmp/staging-preview-${{ matrix.portal }}/evidence.json

  smoke:
    name: Staging smoke + evidence
    needs: [build-api-image, deploy-api-oci, migrate-supabase, prove-vercel-preview]
    if: ${{ always() && needs.deploy-api-oci.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Require all three Preview proofs
        if: ${{ needs.prove-vercel-preview.result != 'skipped' }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prove-vercel-preview.result }}" != "success" ]; then
            echo "::error::one or more Vercel Preview proofs failed — staging frontend proof blocked"
            exit 1
          fi

      - name: Download Preview evidence artifacts
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: staging-preview-evidence-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          # NO merge-multiple: each portal's artifact holds evidence.json at its
          # root. Attempt-scoped names prevent immutable-artifact collisions on
          # rerun, while separate directories prevent three evidence.json files
          # from overwriting one another.
          path: /tmp/preview-evidence-raw

      - name: Normalize Preview evidence paths
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/preview-evidence
          for portal in customer vendor admin; do
            artifact_name="staging-preview-evidence-${portal}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            src="/tmp/preview-evidence-raw/${artifact_name}/evidence.json"
            if [ ! -f "${src}" ]; then
              # download-artifact merge-multiple may flatten paths
              alt="/tmp/preview-evidence-raw/${portal}/evidence.json"
              if [ -f "${alt}" ]; then
                src="${alt}"
              else
                found="$(find /tmp/preview-evidence-raw -path "*/${portal}/evidence.json" -print -quit 2>/dev/null || true)"
                if [ -n "${found}" ]; then
                  src="${found}"
                fi
              fi
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::missing evidence for ${portal}"
              find /tmp/preview-evidence-raw -type f | sort || true
              exit 1
            fi
            mkdir -p "/tmp/preview-evidence/${portal}"
            cp "${src}" "/tmp/preview-evidence/${portal}/evidence.json"
          done

      - name: CORS proof — certified immutable Preview origins (RC-6 / PR-F3)
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          CUSTOMER_STAGING_STABLE_HOSTNAME: ${{ vars.CUSTOMER_STAGING_STABLE_HOSTNAME }}
        run: |
          set -euo pipefail
          BASE="${STAGING_API_BASE_URL:-https://${STAGING_API_HOST}}"
          case "$BASE" in
            *api.vergeo5.com*) echo "::error::CORS proof refused production API"; exit 1 ;;
          esac
          extra_origin_args=()
          if [ -n "${CUSTOMER_STAGING_STABLE_HOSTNAME:-}" ]; then
            extra_origin_args=(--extra-origin "https://${CUSTOMER_STAGING_STABLE_HOSTNAME}")
          fi
          bash scripts/ci/staging-cors-preview-probe.sh \
            --preview-dir /tmp/preview-evidence \
            --api-base "${BASE}" \
            "${extra_origin_args[@]}"

      - name: Native DB pool + service-role read proof (cart-location remediation)
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          set -euo pipefail
          BASE="${STAGING_API_BASE_URL:-https://${STAGING_API_HOST}}"
          case "$BASE" in
            *api.vergeo5.com*) echo "::error::DB service-role proof refused production API"; exit 1 ;;
          esac
          bash scripts/ci/staging-db-service-role-proof.sh \
            --preview-dir /tmp/preview-evidence \
            --api-base "${BASE}" \
            --listing-id f1000000-0000-4000-8000-000000000001

      # ── Stable same-site Customer hostname: guest-cart browser proof ───────
      # Opt-in only (docs/ops/staging-samesite-guest-cart.md): every step below
      # is a no-op — no Node setup, no npm install, no browser download — until
      # an operator sets the CUSTOMER_STAGING_STABLE_HOSTNAME repository/
      # environment variable, after the one-time DNS + Vercel custom-domain
      # setup the doc describes. Once set, this is a real gate: the
      # prove-vercel-preview job already refused to report success unless its
      # alias step confirmed this exact SHA's deployment is what the hostname
      # points at, so a failure here is a genuine guest-cart regression, not a
      # flake to route around.
      - name: Setup Node (stable-hostname cart probe)
        if: ${{ needs.prove-vercel-preview.result == 'success' && vars.CUSTOMER_STAGING_STABLE_HOSTNAME != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install e2e dependencies (stable-hostname cart probe)
        if: ${{ needs.prove-vercel-preview.result == 'success' && vars.CUSTOMER_STAGING_STABLE_HOSTNAME != '' }}
        working-directory: e2e
        run: npm ci

      - name: Install Chromium (stable-hostname cart probe)
        if: ${{ needs.prove-vercel-preview.result == 'success' && vars.CUSTOMER_STAGING_STABLE_HOSTNAME != '' }}
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Guest-cart SameSite proof on the stable Customer hostname
        if: ${{ needs.prove-vercel-preview.result == 'success' && vars.CUSTOMER_STAGING_STABLE_HOSTNAME != '' }}
        working-directory: e2e
        env:
          CUSTOMER_STAGING_STABLE_URL: https://${{ vars.CUSTOMER_STAGING_STABLE_HOSTNAME }}
          CUSTOMER_STAGING_API_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: node --experimental-strip-types scripts/customer-stable-cart-probe.mjs

      - name: Health + fingerprint
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          PROD_SUPABASE_PROJECT_REF: ${{ env.PROD_SUPABASE_PROJECT_REF }}
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.build-api-image.outputs.image_tag }}
        run: |
          set -euo pipefail
          BASE="${STAGING_API_BASE_URL:-https://${STAGING_API_HOST}}"
          case "$BASE" in
            *api.vergeo5.com*) echo "::error::smoke refused production API"; exit 1 ;;
          esac
          echo "Probing ${BASE}/healthz"
          curl -fsS --max-time 30 "${BASE}/healthz" | tee /tmp/healthz.json
          echo "Probing ${BASE}/readyz"
          curl -fsS --max-time 30 "${BASE}/readyz" | tee /tmp/readyz.json
          echo "Probing ${BASE}/fingerprint"
          curl -fsS --max-time 30 "${BASE}/fingerprint" | tee /tmp/fingerprint.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts/ci")
          from validate_staging_proof import ProofValidationError, validate_api_fingerprint

          fp = json.load(open("/tmp/fingerprint.json"))
          try:
              validate_api_fingerprint(
                  fp,
                  candidate_sha=os.environ["CANDIDATE_SHA"],
                  staging_supabase_project_id=os.environ["STAGING_SUPABASE_PROJECT_ID"],
                  expected_image_tag=os.environ.get("EXPECTED_IMAGE_TAG") or None,
              )
          except ProofValidationError as exc:
              print(f"::error::{exc}")
              sys.exit(1)
          print(
              "OK fingerprint",
              {k: fp.get(k) for k in ("env", "git_sha", "image_tag", "supabase_project_ref")},
          )
          PY

      - name: Migration status evidence
        if: ${{ needs.migrate-supabase.result == 'success' }}
        run: echo "migrate-supabase job succeeded (repository-vs-remote reconciliation verified in that job)"

      - name: Bundle staging SHA proof artifact
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          migrate_result="${{ needs.migrate-supabase.result }}"
          bundle_args=(
            --candidate-sha "${{ github.sha }}"
            --preview-dir /tmp/preview-evidence
            --fingerprint /tmp/fingerprint.json
            --staging-supabase-project-id "${STAGING_SUPABASE_PROJECT_ID}"
            --expected-image-tag "${{ needs.build-api-image.outputs.image_tag }}"
            --migrate-result "${migrate_result}"
            --output /tmp/staging-sha-proof.json
          )
          if [ "${migrate_result}" = "skipped" ]; then
            bundle_args+=(--allow-migrate-skipped)
          fi
          bash scripts/ci/staging-evidence-bundle.sh "${bundle_args[@]}"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/healthz.json
            /tmp/readyz.json
            /tmp/fingerprint.json

      - name: Upload unified staging SHA proof
        if: ${{ needs.prove-vercel-preview.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-sha-proof-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/staging-sha-proof.json

  # Explicit non-promotion marker — this workflow never deploys production.
  never-promote-production:
    name: Guard — no production promotion
    needs: [smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Affirm staging-only scope
        run: |
          echo "This workflow deploys staging only."
          echo "It never writes to api.vergeo5.com, production Supabase, or Vercel Production."
          echo "Promotion to production requires a separate, explicit production workflow."
