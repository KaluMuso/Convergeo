name: Financial packet materialization
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'KaluMuso/Convergeo' && github.head_ref == 'hardening/20260925-ci-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d5649e5258a81459eb242c2d0d8919010991f945
          persist-credentials: false
      - name: Verify and materialize bounded source objects without branch writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path
          encoded = ''''''
          # This workflow contains only an exact bounded source packet. It never executes provider or database operations.
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 34174 and hashlib.sha256(patch).hexdigest() == 'f04bef10349e250077d9e43ddb3b798685523864df1d88eea81e9cb947d5fa78'
          out = Path(os.environ['RUNNER_TEMP']) / 'financial-materialized'
          out.mkdir()
          p = out / 'packet.patch'; p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '4a9e6c329d8ae38ece611ef9bb19d8e872d6eac9'
          allowed = {'.github/workflows/ci.yml','.github/workflows/financial-source-evidence.yml','scripts/ci/financial-real-stack-report.py','scripts/ci/run-financial-real-stack.sh','scripts/ci/test_financial_real_stack_report.py','scripts/drills/run-f2-real-stack.sh','services/api/tests/test_reconcile_staging_migrations.py','services/api/tests/test_schema_convergence.py'}
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths) == allowed
          records = []
          for name in paths:
              data = Path(name).read_bytes()
              request = out/'request.json'; request.write_text(json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}))
              response = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/KaluMuso/Convergeo/git/blobs','--input',str(request)],text=True))
              sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert response['sha'] == sha
              records.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              request.unlink()
          (out/'manifest.json').write_text(json.dumps({'base':'d5649e5258a81459eb242c2d0d8919010991f945','tree':tree,'entries':records},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: financial-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/financial-materialized/
          if-no-files-found: error
          retention-days: 7
