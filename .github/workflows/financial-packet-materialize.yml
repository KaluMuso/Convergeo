name: Financial packet materialization
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'KaluMuso/Convergeo' && github.head_ref == 'hardening/20260925-ci-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: deb625caf86ba870eef85c877d65b4b37872fdcb
          persist-credentials: false
      - name: Upload exact approved source blobs without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          base = "deb625caf86ba870eef85c877d65b4b37872fdcb"
          base_tree = "32aea25707f9e87eb02fd545356a230beb32bfd3"
          target = "8593142b46a921560eea976b734e2bde07fcde97"
          expected = {
              ".github/workflows/ci.yml": "2b28813168e65537852eb9e09dd23c76e93327dd",
              ".github/workflows/financial-packet-materialize.yml": None,
              ".github/workflows/financial-source-evidence.yml": None,
              "packages/types/src/db.ts": "1439f7038f24452356ad8753482a12143aea005c",
              "scripts/ci/run_financial_real_stack.py": "45e545346e0e7d95d94ebc2cc3b8a72dc86c5af3",
              "scripts/ci/test_financial_ci_orchestration.py": "59078c6f885149fd0116678a588fdcc1b8e7c85c",
              "services/api/tests/test_f1_payout_real_stack.py": "0f8ba2bf30cb872ff67f9822e1bebe97f4079cb5",
              "services/api/tests/test_reconcile_staging_migrations.py": "5a8f12634614e64ab95c1ca603b26b025da88a71",
              "services/api/tests/test_schema_convergence.py": "a7fa51548e96327d0ed360ee8d24addab9c467b0",
          }
          def git(*args):
              return subprocess.check_output(["git", *args])
          assert git("rev-parse", "HEAD").decode().strip() == base
          assert git("rev-parse", "HEAD^{tree}").decode().strip() == base_tree
          assert not git("status", "--porcelain")
          encoded = (
              ""
              ""
              ""
          )
          assert hashlib.sha256(encoded.encode()).hexdigest() == "2c2603452a05aa22bd6037b3568ddca3ec9e1969b495a9e0164830d42aeca13e"
          decoder = lzma.LZMADecompressor(memlimit=134217728)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=49047)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 49046
          assert hashlib.sha256(patch).hexdigest() == "03280e684dbf2273b4fca83d40d0831ece21215f5c9009f80605820d74af9528"
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "financial-materialized"
          out.mkdir(parents=True, exist_ok=True)
          patch_file = out / "approved-files.patch"
          patch_file.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(patch_file)], check=True)
          subprocess.run(["git", "apply", "--index", str(patch_file)], check=True)
          subprocess.run(["git", "rm", "--", *[p for p, sha in expected.items() if sha is None]], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          full_patch = git("diff", "--cached", "--binary", "--full-index")
          assert len(full_patch) == 63547
          assert hashlib.sha256(full_patch).hexdigest() == "3c6e0ea01f2c4a2c903d8d9dd738c4fa20b23af70c6565c334927183db145a41"
          (out / "approved-cumulative.patch").write_bytes(full_patch)
          assert git("write-tree").decode().strip() == target
          paths = git("diff", "--cached", "--name-only", "-z").decode().rstrip("\0").split("\0")
          assert set(paths) == set(expected) and len(paths) == 9
          entries = []
          for path in sorted(paths):
              sha = expected[path]
              if sha is None:
                  assert not git("ls-files", "-s", "--", path)
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              line = git("ls-files", "-s", "--", path).decode().strip()
              assert line == f"100644 {sha} 0\t{path}", line
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert actual == sha
              request = pathlib.Path(os.environ["RUNNER_TEMP"]) / "financial-blob-request.json"
              request.write_text(json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}))
              try:
                  response = json.loads(subprocess.check_output(["gh", "api", "--method", "POST", "repos/KaluMuso/Convergeo/git/blobs", "--input", str(request)]))
              finally:
                  request.unlink(missing_ok=True)
              assert response["sha"] == sha, (path, response.get("sha"))
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": sha})
          manifest = {"base": base, "base_tree": base_tree, "approved_tree": target,
                      "approved_cumulative_sha256": hashlib.sha256(full_patch).hexdigest(),
                      "entries": entries, "source_ref_updated": False, "database_executed": False}
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("Verified approved tree; uploaded seven source blobs. No commit/ref/database action.")
          PY
      - name: Preserve verified source manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/financial-materialized
          if-no-files-found: error
          retention-days: 7
