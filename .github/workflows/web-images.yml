name: Web images (GHCR)

# Builds customer and vendor Next.js standalone images on GitHub runners and pushes
# to GHCR for Hetzner (or any Docker host) — no secrets in the image; NEXT_PUBLIC_*
# are repository variables passed as build-args.

on:
  push:
    branches: [master]
    paths:
      - "apps/customer/**"
      - "apps/vendor/**"
      - "packages/**"
      - "infra/customer.Dockerfile"
      - "infra/vendor.Dockerfile"
      - ".github/workflows/web-images.yml"
  workflow_dispatch:

concurrency:
  group: web-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: customer
            dockerfile: infra/customer.Dockerfile
            image: convergeo-customer
          - app: vendor
            dockerfile: infra/vendor.Dockerfile
            image: convergeo-vendor
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_ADMIN_BYPASS=${{ vars.NEXT_PUBLIC_ADMIN_BYPASS }}
            NEXT_PUBLIC_ANALYTICS_ENDPOINT=${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
            NEXT_PUBLIC_ANALYTICS_V2_TRACKING=${{ vars.NEXT_PUBLIC_ANALYTICS_V2_TRACKING }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_CI_PERF_HARNESS=${{ vars.NEXT_PUBLIC_CI_PERF_HARNESS }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_DEPLOYMENT_PLANE=${{ vars.NEXT_PUBLIC_DEPLOYMENT_PLANE }}
            NEXT_PUBLIC_E2E_MOCK_SESSION=${{ vars.NEXT_PUBLIC_E2E_MOCK_SESSION }}
            NEXT_PUBLIC_ENABLE_UI_PREVIEW=${{ vars.NEXT_PUBLIC_ENABLE_UI_PREVIEW }}
            NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
            NEXT_PUBLIC_LENCO_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_LENCO_PUBLIC_KEY }}
            NEXT_PUBLIC_PHONE_OTP_ENABLED=${{ vars.NEXT_PUBLIC_PHONE_OTP_ENABLED }}
            NEXT_PUBLIC_SEASONAL_THEME=${{ vars.NEXT_PUBLIC_SEASONAL_THEME }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ vars.NEXT_PUBLIC_SENTRY_RELEASE }}
            NEXT_PUBLIC_SHOW_SAMPLE_LISTINGS=${{ vars.NEXT_PUBLIC_SHOW_SAMPLE_LISTINGS }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SOCIAL_FACEBOOK_URL=${{ vars.NEXT_PUBLIC_SOCIAL_FACEBOOK_URL }}
            NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL=${{ vars.NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL }}
            NEXT_PUBLIC_SOCIAL_TWITTER_URL=${{ vars.NEXT_PUBLIC_SOCIAL_TWITTER_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_VENDOR_APP_URL=${{ vars.NEXT_PUBLIC_VENDOR_APP_URL }}
            NEXT_PUBLIC_VENDOR_PAYOUTS_ENABLED=${{ vars.NEXT_PUBLIC_VENDOR_PAYOUTS_ENABLED }}
            NEXT_PUBLIC_VERGEO_API_URL=${{ vars.NEXT_PUBLIC_VERGEO_API_URL }}
            NEXT_PUBLIC_VERGEO_BUILD_ID=${{ vars.NEXT_PUBLIC_VERGEO_BUILD_ID }}
            NEXT_PUBLIC_VERGEO_ENV=${{ vars.NEXT_PUBLIC_VERGEO_ENV }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.app }}