name: Qualified dependency source materialization
on:
  pull_request:
    branches: [hardening/20260924-converged-implementation]
    paths: [.github/workflows/dependency-repair-prepare.yml]
permissions:
  contents: read
concurrency:
  group: dependency-source-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  materialize:
    if: >-
      github.repository == 'KaluMuso/Convergeo' &&
      github.event.pull_request.number == 715 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/20260925-ci-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication scope and all no-deployment guards
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          base='8bacd9c51fb4edd42838c3089128976026d525f3'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==['.github/workflows/dependency-repair-prepare.yml']
          for path in ('vercel.json','apps/customer/vercel.json','apps/vendor/vercel.json','apps/admin/vercel.json'):
              guards=json.loads(pathlib.Path(path).read_text())['git']['deploymentEnabled']
              assert guards['hardening/20260925-ci-recovery'] is False
              assert guards['hardening/20260924-converged-implementation'] is False
          pathlib.Path('dependency-materialization-evidence').mkdir()
          PY
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: KaluMuso/Convergeo
          run-id: 36811810665
          artifact-ids: 11139956108
          merge-multiple: true
          path: ${{ runner.temp }}/qualified-dependency-input
      - name: Verify qualified artifact and create only three unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          import urllib.error, urllib.request
          import xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'qualified-dependency-input'
          out=root/'dependency-materialization-evidence'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('Unexpected GitHub API redirect')
          opener=urllib.request.build_opener(NoRedirect())
          def api(path,data=None):
              assert path in ('actions/artifacts/11139956108','actions/runs/36811810665','git/blobs')
              req=urllib.request.Request('https://api.github.com/repos/KaluMuso/Convergeo/'+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              try:
                  with opener.open(req,timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('GitHub object operation failed HTTP '+str(exc.code)) from None
          artifact=api('actions/artifacts/11139956108')
          assert artifact['digest']=='sha256:ab0895cae093e39499e3238d6dce0e520bb07b95fbfafbfc690adc9d849c3256'
          assert artifact['workflow_run']['id']==36811810665 and not artifact['expired']
          run=api('actions/runs/36811810665')
          assert run['conclusion']=='success' and run['head_sha']=='f141d0bfac5ec56862b837547d46f205c8a3ccfa'
          identity=json.loads((source/'identity.json').read_text())
          assert identity['actual_checkout']==run['head_sha']
          assert identity['base_commit']=='8bacd9c51fb4edd42838c3089128976026d525f3'
          assert identity['base_tree']=='8593142b46a921560eea976b734e2bde07fcde97'
          audit=json.loads((source/'audit/manifest.json').read_text())
          assert audit['CONSUMER_CORRECTNESS']=='PASS' and audit['DEPENDENCY_RISK']=='GREEN'
          assert not audit['evidenceErrors'] and not audit['policyFindings']
          assert all(step['exitCode']==0 for step in audit['steps'].values())
          cases=list(ET.parse(source/'affected-api.xml').getroot().iter('testcase'))
          assert len(cases)==179 and len({(c.get('classname'),c.get('name')) for c in cases})==179
          assert not any(c.find('failure') is not None or c.find('error') is not None for c in cases)
          skipped=[c for c in cases if c.find('skipped') is not None]
          assert len(skipped)==1 and skipped[0].get('classname')=='tests.test_payment_state.TestMigration0016'
          assert skipped[0].get('name')=='test_migration_widens_payment_status_check'
          patch=source/'dependency-repair.patch'
          assert patch.stat().st_size==6892
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='8e02ba1e7c654905acd2b44833df6f334439089e10438c7ba3577b80ce08e343'
          expected={'package.json':'c9b166c895ac5bda7710338bbf69089c2c0d7cdd',
                    'pnpm-lock.yaml':'565b05856f03262d1b8e399bdde7ae2a24e1d1d7',
                    'services/api/uv.lock':'b63bc35161bc632dcc1ebd7c8b4559ee972a2d62'}
          assert identity['changed_paths']==sorted(expected)
          for path in expected:
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==identity['baseline_sha256'][path]
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()==sorted(expected)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','rm','--cached','--','.github/workflows/dependency-repair-prepare.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='781527901365885bdb8cae8a07d3a9880b053e89'
          entries=[]
          for path,sha in expected.items():
              raw=(root/path).read_bytes()
              assert raw==(source/'source'/path).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==identity['updated_sha256'][path]
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              remote=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert remote['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          result={'source_run':36811810665,'source_artifact':11139956108,
                  'actual_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'target_tree':tree,'entries':entries,'blobs_materialized':True,
                  'ref_changed_by_runner':False,'source_published_by_runner':False,
                  'financial_or_release_acceptance':False,'affected_api_passed':178,
                  'unwaived_database_skips':1}
          (out/'materialized.json').write_text(json.dumps(result,indent=2)+'\n')
          print('EXACT_DEPENDENCY_BLOBS_MATERIALIZED; NO_REF_UPDATE')
          PY
      - name: Retain only nonsecret source-object evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-materialization-${{ github.sha }}-${{ github.run_attempt }}
          path: dependency-materialization-evidence
          if-no-files-found: error
