name: Release certification

# Independent release-certification suite — on-demand and weekly.
# Aggregates Layer 1 static + Layer 2 integration + Layer 3 E2E (when staging reachable).
# Does NOT merge; produces evidence artifacts for promotion decisions.
on:
  schedule:
    # Sunday 03:00 UTC weekly baseline.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - local
      skip_e2e:
        description: "Skip browser E2E (static + integration only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-certify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Release certification orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      LENCO_ENV: ${{ secrets.LENCO_ENV }}
      LENCO_API_TOKEN: ${{ secrets.LENCO_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm i --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: services/api/.python-version

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --dev

      - name: Run static + integration certification
        run: |
          ARGS=(--environment "${{ inputs.environment || 'staging' }}")
          if [ "${{ inputs.skip_e2e }}" = "true" ]; then
            ARGS+=(--skip-e2e)
          fi
          bash scripts/qa/release-certify.sh "${ARGS[@]}"

      - name: Install Playwright for E2E (when staging reachable)
        if: inputs.skip_e2e != true && env.E2E_BASE_URL != ''
        working-directory: e2e
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Run E2E certification specs
        if: inputs.skip_e2e != true && env.E2E_BASE_URL != ''
        working-directory: e2e
        env:
          CI: "true"
          E2E_THROTTLE: "0"
        run: |
          npx playwright test \
            specs/browse-journey.spec.ts \
            specs/mobile-layout.spec.ts \
            specs/data-quality.spec.ts \
            specs/ux-surfaces.spec.ts \
            specs/a11y-smoke.spec.ts \
            specs/performance-smoke.spec.ts \
            --project=mobile-fast-3g-360

      - name: Re-collect certificate after E2E
        if: always()
        run: |
          node scripts/qa/collect-certificate.mjs \
            --evidence-dir scripts/qa/evidence \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --environment "${{ inputs.environment || 'staging' }}"

      - name: Upload release certificate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-certificate-${{ github.run_id }}
          path: |
            scripts/qa/evidence/release-certificate.json
            scripts/qa/evidence/release-certificate.md
            scripts/qa/evidence/gate-*.json
            e2e/results/
            e2e/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
